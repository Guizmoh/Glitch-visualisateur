      timeZone: tz, pageSize: 10
    }, {cache:{staleTime:30000}});
    const evts = fouiller(res && res.payload, o => typeof o.summary === 'string' && o.summary.length > 0);
    const vus = new Set(), noms = [];
    evts.forEach(o => { const s = o.summary.trim(); if (!vus.has(s) && noms.length < 8){ vus.add(s); noms.push(s); } });
    zone.innerHTML = noms.length
      ? 'Ce jour-là, ton agenda contient déjà :<ul>' + noms.map(n => '<li>' + e(n) + '</li>').join('') + '</ul>'
      : 'Journée libre dans ton Google Agenda.';
  } catch(err){ zone.textContent = msgMcp(err, GCAL); }
}

async function envoyerEcheances(m){
  const zone = $('#retour-mcp'); if (!zone) return;
  const restantes = (m.taches || []).filter(t => !t.fait && estDate(t.echeance) && t.echeance >= aujourdhui()).slice(0, 12);
  if (!restantes.length){ zone.textContent = 'Aucune échéance à venir sur cette fiche.'; return; }
  const mcp = await mcpNs();
  if (!mcp){ zone.textContent = 'Google Agenda n’est pas disponible dans cette vue.'; return; }
  let ok = 0, dernierMsg = '';
  for (const t of restantes){
    zone.textContent = 'Envoi… (' + (ok + 1) + '/' + restantes.length + ')';
    try {
      await creerEvenement(m, {
        titre: t.label + ' — ' + couple(m),
        debut: t.echeance + 'T09:00:00', fin: t.echeance + 'T09:30:00',
        description: 'Mariage ' + couple(m) + (estDate(m.date) ? ' le ' + fmtCourt(m.date) : '') + (m.lieuNom ? ' · ' + m.lieuNom : '')
      });
      ok++;
    } catch(err){ dernierMsg = msgMcp(err, GCAL); break; }
  }
  zone.textContent = ok + ' échéance(s) ajoutée(s) à ton agenda.' + (dernierMsg ? ' Arrêt : ' + dernierMsg : '');
}

/* =======================================================================
   Écouteurs
   ======================================================================= */
let attenteSuppr = null;

document.addEventListener('click', async ev => {
  const t = ev.target;
  const dans = s => t.closest(s);
  let el;

  if (dans('[data-ferme-texte]')){ const mo = $('#modale-texte'); if (mo) mo.remove(); return; }
  if (dans('[data-ferme]')){ fermerFiche(); return; }

  if ((el = dans('[data-copie]'))){ copier(el.dataset.copie, 'Adresse copiée.'); return; }
  if ((el = dans('[data-copie-zone]'))){ const z = document.getElementById(el.dataset.copieZone); if (z) copier(z.value, 'Copié.'); return; }
  if ((el = dans('[data-va]'))){ changerVue(el.dataset.va); return; }
  if ((el = dans('#onglets .onglet'))){ changerVue(el.dataset.vue); return; }
  if ((el = dans('[data-ouvre]'))){ ouvrirFiche(el.dataset.ouvre); return; }

  if (dans('#eclair-ajout')){ ajoutEclair(); return; }
  if (dans('#sup-exemples')){
    const ex = Array.from(Etat.mariages.values()).filter(x => x.exemple);
    for (const x of ex) await Stock.supprimer(x.id);
    rendreTout(); annonce(ex.length + ' fiche(s) d’exemple supprimée(s).'); return;
  }
  if (dans('#eclair-vide')){ creerDepuis({}, true); return; }

  /* --- tableur --- */
  if ((el = dans('#grille thead th[data-col]'))){
    const c = el.dataset.col;
    Etat.tri = (Etat.tri.col === c) ? {col:c, sens:-Etat.tri.sens} : {col:c, sens: c === 'date' || c === 'couple' || c === 'lieu' || c === 'ville' || c === 'source' || c === 'statut' ? 1 : -1};
    rendreTableur(); return;
  }
  if ((el = dans('#grille input[data-coche]'))){
    const id = el.dataset.coche;
    if (el.checked) Etat.choix.add(id); else Etat.choix.delete(id);
    rendreTableur(); ev.stopPropagation(); return;
  }
  if (dans('#coche-tout')){
    const toutes = lignesTableur();
    const plein = toutes.every(m => Etat.choix.has(m.id));
    toutes.forEach(m => plein ? Etat.choix.delete(m.id) : Etat.choix.add(m.id));
    rendreTableur(); return;
  }
  if (dans('#tout-cocher')){ lignesTableur().forEach(m => Etat.choix.add(m.id)); rendreTableur(); return; }
  if (dans('#rien-cocher')){ Etat.choix.clear(); rendreTableur(); return; }
  if ((el = dans('#grille tbody tr[data-id]'))){ ouvrirFiche(el.dataset.id); return; }
  if (dans('#export-csv')){ exporterFiches(Etat.choix.size ? lignesTableur().filter(m => Etat.choix.has(m.id)) : lignesTableur()); return; }

  /* --- analyse --- */
  if ((el = dans('[data-periode]'))){ Etat.periode.mode = el.dataset.periode; rendreAnalyse(); return; }
  if ((el = dans('[data-statut-periode]'))){
    const k = el.dataset.statutPeriode, i = Etat.periode.statuts.indexOf(k);
    if (i >= 0) Etat.periode.statuts.splice(i, 1); else Etat.periode.statuts.push(k);
    rendreAnalyse(); return;
  }
  if (dans('#export-analyse')){
    const b = bornesPeriode(), liste = fichesPeriode(), tot = cumul(liste);
    const l = liste.map(m => { const c = calc(m); return [m.date, couple(m), m.lieuNom, m.lieuVille, (STATUTS[m.statut]||{}).l, c.total, c.fraisTot, c.benefice, c.heuresTot, c.tauxHoraire == null ? '' : Math.round(c.tauxHoraire)]; });
    l.push([]); l.push(['TOTAL ' + b.lib, tot.n + ' mariages', '', '', '', tot.ca, tot.frais, tot.benef, tot.h, tot.h ? Math.round(tot.benef / tot.h) : '']);
    telecharger('analyse-' + aujourdhui() + '.csv', csvDe(['Date','Mariés','Lieu','Ville','Statut','CA','Frais','Bénéfice','Heures','€/h'], l), 'text/csv;charset=utf-8');
    return;
  }

  /* --- agenda --- */
  if ((el = dans('[data-annee-agenda]'))){ Etat.anneeAgenda = +el.dataset.anneeAgenda; rendreAgenda(); return; }
  if (dans('#gcal-annee')){
    const zone = $('#gcal-retour');
    const lot = Array.from(Etat.mariages.values())
      .filter(m => String(m.date||'').slice(0,4) === String(Etat.anneeAgenda) && m.statut !== 'annule' && !m.gcalLien)
      .sort((x,y) => x.date.localeCompare(y.date)).slice(0, 25);
    if (!lot.length){ zone.textContent = 'Rien de nouveau à envoyer pour ' + Etat.anneeAgenda + '.'; return; }
    let ok = 0, stop = '';
    for (const m of lot){
      zone.textContent = 'Envoi de ' + couple(m) + '… (' + (ok + 1) + '/' + lot.length + ')';
      try { await ajouterAuCalendrier(m); ok++; } catch(err){ stop = msgMcp(err, GCAL); break; }
    }
    zone.textContent = ok + ' mariage(s) ajouté(s) à ton Google Agenda.' + (stop ? ' Arrêt : ' + stop : '');
    return;
  }

  /* --- à faire --- */
  if ((el = dans('[data-fait]'))){
    const [idM, idT] = el.dataset.fait.split('|');
    const m = Etat.mariages.get(idM); if (!m) return;
    const tache = (m.taches || []).find(x => x.id === idT); if (!tache) return;
    tache.fait = el.checked;
    enregistrer(idM, true); rendreTout(); return;
  }

  /* --- réglages --- */
  if ((el = dans('[data-sup-reglage]'))){
    const [cle, i] = el.dataset.supReglage.split('|');
    Etat.reglages[cle].splice(+i, 1); Stock.ecrireReglages(); rendreReglages(); return;
  }
  if ((el = dans('[data-ajout-reglage]'))){
    const cle = el.dataset.ajoutReglage;
    Etat.reglages[cle].push('Nouveau');
    Stock.ecrireReglages(); rendreReglages();
    const champs = $$('[data-sup-reglage^="' + cle + '|"]');
    if (champs.length) champs[champs.length - 1].closest('.etiq').scrollIntoView({block:'nearest'});
    return;
  }
  if (dans('#ajout-formule')){ Etat.reglages.formules.push({nom:'Nouvelle formule', prix:0, heures:0}); Stock.ecrireReglages(); rendreReglages(); return; }
  if ((el = dans('[data-sup-formule]'))){ Etat.reglages.formules.splice(+el.dataset.supFormule, 1); Stock.ecrireReglages(); rendreReglages(); return; }
  if (dans('#ajout-mt')){ Etat.reglages.modeleTaches.push({label:'Nouvelle tâche', offset:-30}); Stock.ecrireReglages(); rendreReglages(); return; }
  if ((el = dans('[data-sup-mt]'))){ Etat.reglages.modeleTaches.splice(+el.dataset.supMt, 1); Stock.ecrireReglages(); rendreReglages(); return; }
  if (dans('#ajout-mte')){ Etat.reglages.modeleTemps.push({libelle:'Nouveau poste', heures:1}); Stock.ecrireReglages(); rendreReglages(); return; }
  if ((el = dans('[data-sup-mte]'))){ Etat.reglages.modeleTemps.splice(+el.dataset.supMte, 1); Stock.ecrireReglages(); rendreReglages(); return; }
  if (dans('#exp-csv-tout')){ exporterFiches(tousTries()); return; }
  if (dans('#exp-json')){
    telecharger('carnet-mariages-' + aujourdhui() + '.json',
      JSON.stringify({version:1, exporte:new Date().toISOString(), reglages:Etat.reglages, mariages:tousTries()}, null, 2),
      'application/json'); return;
  }
  if (dans('#imp-json')){ $('#fichier-json').click(); return; }
  if (dans('#exemple')){ exemples(); return; }

  /* --- fiche --- */
  const m = fiche();
  if (!m) return;

  if ((el = dans('[data-presta]'))){
    const p = el.dataset.presta;
    m.prestations = m.prestations || [];
    const i = m.prestations.indexOf(p);
    if (i >= 0) m.prestations.splice(i, 1); else m.prestations.push(p);
    el.setAttribute('aria-pressed', String(i < 0));
    enregistrer(m.id); return;
  }
  if ((el = dans('[data-ajout]'))){
    const liste = el.dataset.ajout;
    m[liste] = m[liste] || [];
    if (liste === 'paiements') m.paiements.push({id:uid(), libelle: m.paiements.length ? 'Solde' : 'Acompte', date:aujourdhui(), montant:0});
    else if (liste === 'frais') m.frais.push({id:uid(), libelle:'', montant:0});
    else if (liste === 'temps') m.temps.push({id:uid(), libelle:'', heures:0});
    else if (liste === 'taches') m.taches.push({id:uid(), label:'Nouvelle tâche', echeance:aujourdhui(), offset:null, fait:false});
    enregistrer(m.id, true); rendreFiche(); return;
  }
  if ((el = dans('[data-sup]'))){
    const [liste, i] = el.dataset.sup.split('|');
    (m[liste] || []).splice(+i, 1);
    enregistrer(m.id, true); rendreFiche(); rendreTout(); return;
  }
  if ((el = dans('[data-tache]'))){
    const tache = m.taches[+el.dataset.tache];
    if (tache){ tache.fait = el.checked; enregistrer(m.id, true); rendreFiche(); rendreTout(); }
    return;
  }
  if (dans('#acompte-recu')){
    const c = calc(m);
    m.paiements = m.paiements || [];
    m.paiements.push({id:uid(), libelle:'Acompte', date:aujourdhui(), montant: Math.max(0, c.acompteDu - c.encaisse)});
    if (m.statut === 'demande' || m.statut === 'devis' || m.statut === 'option') m.statut = 'confirme';
    if (!m.contratLe) m.contratLe = aujourdhui();
    enregistrer(m.id, true); rendreFiche(); rendreTout(); return;
  }
  if (dans('#solde-recu')){
    const c = calc(m);
    m.paiements.push({id:uid(), libelle:'Solde', date:aujourdhui(), montant: c.reste});
    enregistrer(m.id, true); rendreFiche(); rendreTout(); return;
  }
  if (dans('#temps-modele')){
    m.temps = (Etat.reglages.modeleTemps || []).map(x => ({id:uid(), libelle:x.libelle, heures:nb(x.heures)}));
    enregistrer(m.id, true); rendreFiche(); rendreTout(); return;
  }
  if (dans('#taches-regen')){ genererTaches(m); enregistrer(m.id, true); rendreFiche(); rendreTout(); return; }
  if (dans('#copier-fiche')){ copier(ficheEnTexte(m), 'Fiche copiée, prête à coller.'); return; }
  if (dans('#dupliquer')){ dupliquer(m); return; }
  if ((el = dans('#supprimer'))){
    if (attenteSuppr === m.id){
      const nom = couple(m);
      attenteSuppr = null;
      await Stock.supprimer(m.id);
      fermerFiche();
      annonce(nom + ' supprimé.');
    } else {
      attenteSuppr = m.id;
      el.textContent = 'Confirmer la suppression';
      el.style.background = 'var(--brique-fond)'; el.style.color = 'var(--brique)'; el.style.borderColor = 'var(--brique-trait)';
      setTimeout(() => {
        if (attenteSuppr === m.id){ attenteSuppr = null; if (document.body.contains(el)){ el.textContent = 'Supprimer'; el.style.background = ''; el.style.color = ''; el.style.borderColor = ''; } }
      }, 4500);
    }
    return;
  }
  if ((el = dans('[data-brouillon]'))){ brouillon(m, el.dataset.brouillon); return; }
  if (dans('#gmail-fil')){ chercherFil(m); return; }
  if (dans('#gcal-verif')){ verifierJour(m); return; }
  if (dans('#gcal-echeances')){ envoyerEcheances(m); return; }
  if (dans('#gcal-ajout')){
    const zone = $('#retour-mcp');
    if (!estDate(m.date)){ zone.textContent = 'Renseigne d’abord la date du mariage.'; return; }
    zone.textContent = 'Création de l’évènement…';
    try {
      const lien = await ajouterAuCalendrier(m);
      zone.innerHTML = 'Évènement créé dans Google Agenda.' + (lien ? ' <a href="' + e(lien) + '" target="_blank" rel="noopener">L’ouvrir</a>' : '');
      if (lien) rendreFiche();
    } catch(err){ zone.textContent = msgMcp(err, GCAL); }
    return;
  }
});

/* ---------- saisie au clavier ---------- */
let minuteurFiltre = null;
document.addEventListener('input', ev => {
  const t = ev.target;

  if (t.id === 'eclair-saisie'){ majJetons(); return; }

  if (t.id === 'recherche' || t.id === 'recherche2'){
    clearTimeout(minuteurFiltre);
    minuteurFiltre = setTimeout(() => { if (Etat.vue === 'tableur') rendreTableur(); else rendreListe(); }, 140);
    return;
  }

  if (t.dataset.r != null){
    const v = t.type === 'number' ? nb(t.value) : t.value;
    Etat.reglages[t.dataset.r] = v;
    clearTimeout(minuteurFiltre);
    minuteurFiltre = setTimeout(() => Stock.ecrireReglages(), 500);
    return;
  }
  if (t.dataset.modele != null){
    Etat.reglages.modeles[t.dataset.modele] = t.value;
    clearTimeout(minuteurFiltre);
    minuteurFiltre = setTimeout(() => Stock.ecrireReglages(), 500);
    return;
  }
  for (const [attr, cible, champs] of [['f','formules',['nom','prix','heures']], ['mt','modeleTaches',['label','offset']], ['mte','modeleTemps',['libelle','heures']]]){
    if (t.dataset[attr] != null){
      const [k, i] = t.dataset[attr].split('|');
      if (champs.includes(k) && Etat.reglages[cible][+i]){
        Etat.reglages[cible][+i][k] = (k === 'prix' || k === 'heures' || k === 'offset') ? nb(t.value) : t.value;
        clearTimeout(minuteurFiltre);
        minuteurFiltre = setTimeout(() => Stock.ecrireReglages(), 500);
      }
      return;
    }
  }

  const m = fiche();
  if (!m) return;

  if (t.dataset.c != null){
    const cle = t.dataset.c;
    m[cle] = (cle === 'prix' || cle === 'deplacement' || cle === 'invites') ? (t.value === '' ? (cle === 'invites' ? null : 0) : nb(t.value)) : t.value;
    if (cle === 'a' || cle === 'b'){ const h = $('.fiche-tete h2'); if (h) h.textContent = couple(m); }
    if (cle === 'prix' || cle === 'deplacement') majCalcul();
    enregistrer(m.id);
    return;
  }
  if (t.dataset.liste != null){
    const liste = t.dataset.liste, i = +t.dataset.idx, k = t.dataset.k;
    const rang = (m[liste] || [])[i];
    if (rang){
      rang[k] = (k === 'montant' || k === 'heures') ? nb(t.value) : t.value;
      majCalcul();
      enregistrer(m.id);
    }
    return;
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;

  if (['f-statut','f-annee','f-tri'].includes(t.id)){ rendreListe(); return; }
  if (['f-statut2','f-annee2'].includes(t.id)){ Etat.choix.clear(); rendreTableur(); return; }
  if (t.id === 'periode-de'){ Etat.periode.de = t.value; rendreAnalyse(); return; }
  if (t.id === 'periode-a'){ Etat.periode.a = t.value; rendreAnalyse(); return; }

  if (t.id === 'fichier-json'){
    const f = t.files && t.files[0];
    if (!f) return;
    const lect = new FileReader();
    lect.onload = async () => {
      try {
        const d = JSON.parse(String(lect.result));
        const lot = Array.isArray(d) ? d : (d.mariages || []);
        if (!lot.length) throw new Error('vide');
        if (d.reglages){
          Etat.reglages = Object.assign(JSON.parse(JSON.stringify(REGLAGES_DEFAUT)), d.reglages,
            {modeles: Object.assign({}, REGLAGES_DEFAUT.modeles, d.reglages.modeles || {})});
          await Stock.ecrireReglages();
        }
        let n = 0;
        for (const brut of lot){
          const m = Object.assign(MARIAGE_VIDE(), brut);
          if (!m.id) m.id = uid();
          if (!m.cree) m.cree = new Date().toISOString();
          Etat.mariages.set(m.id, m);
          await Stock.ecrire(m.id);
          n++;
        }
        rendreTout();
        annonce(n + ' fiche(s) restaurée(s).');
      } catch(_){ annonce('Fichier illisible : attendu une sauvegarde JSON de ce carnet.'); }
      t.value = '';
    };
    lect.readAsText(f);
    return;
  }

  const m = fiche();
  if (!m || t.dataset.c == null) return;
  const cle = t.dataset.c;

  if (cle === 'date'){
    genererTaches(m);
    enregistrer(m.id, true); rendreFiche(); rendreTout(); return;
  }
  if (cle === 'statut'){
    if (m.statut === 'devis' && !m.devisLe) m.devisLe = aujourdhui();
    if (m.statut === 'confirme' && !m.contratLe) m.contratLe = aujourdhui();
    enregistrer(m.id, true); rendreFiche(); rendreTout(); return;
  }
  if (cle === 'formule'){ appliquerFormule(m, t.value); enregistrer(m.id, true); rendreFiche(); rendreTout(); return; }
  if (cle === 'lieuNom'){
    const rempli = completerLieu(m);
    enregistrer(m.id, true);
    if (rempli){ rendreFiche(); annonce('Adresse du lieu reprise d’une fiche précédente.'); }
    rendreTout(); return;
  }
  if (cle === 'tel' || cle === 'lieuTel'){ m[cle] = fmtTel(t.value); t.value = m[cle]; enregistrer(m.id, true); return; }
  if (cle === 'a' || cle === 'b'){ m[cle] = capi(t.value.trim()); t.value = m[cle]; enregistrer(m.id, true); rendreTout(); return; }
  enregistrer(m.id, true);
  rendreTout();
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){
    const mo = $('#modale-texte');
    if (mo){ mo.remove(); return; }
    if (Etat.ficheId) fermerFiche();
    return;
  }
  if (ev.key === 'Enter' && ev.target.id === 'eclair-saisie'){ ev.preventDefault(); ajoutEclair(); }
  if (ev.key === 'n' && (ev.metaKey || ev.ctrlKey) && !ev.shiftKey){
    const champ = $('#eclair-saisie');
    if (champ && !Etat.ficheId){ ev.preventDefault(); changerVue('mariages'); champ.focus(); }
  }
});

/* =======================================================================
   Démarrage
   ======================================================================= */
(async function demarrer(){
  remplirSelects();
  $('#f-statut').value = 'actifs';
  $('#f-statut2').value = 'tous';
  rendreTout();
  await Stock.init();
  remplirSelects();
  $('#f-statut').value = 'actifs';
  $('#f-statut2').value = 'tous';
  if (!Etat.mariages.size && Stock.mode !== 'nuage') exemples();
  rendreTout();
  mcpNs(); telechNs();
})();

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ===== DEBUT ARTEFACT ===== -->
<title>Carnet de mariages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --papier:#F0F3ED; --carte:#FBFCF9; --carte2:#F5F8F1; --voile:rgba(27,34,28,.38);
  --trait:#DCE3D6; --trait-fort:#C2CCBA;
  --encre:#1B221C; --encre2:#414C42; --sourdine:#707C71;
  --vert:#3C6B4E; --vert-fond:#E3EDE2; --vert-trait:#B5CBB7;
  --laiton:#8A6726; --laiton-fond:#F2EBD9; --laiton-trait:#DECBA1;
  --ardoise:#3E5E7B; --ardoise-fond:#E3EAF1; --ardoise-trait:#BACDDC;
  --brique:#95423C; --brique-fond:#F5E2E0; --brique-trait:#E0BCB8;
  --rl:14px; --rm:9px; --rs:5px;
  --serif:'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ombre:0 1px 2px rgba(27,34,28,.05), 0 10px 28px -16px rgba(27,34,28,.30);
  --ombre-haut:0 2px 6px rgba(27,34,28,.08), 0 24px 60px -24px rgba(27,34,28,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --papier:#12160F; --carte:#191E19; --carte2:#1F251F; --voile:rgba(0,0,0,.6);
    --trait:#2B322C; --trait-fort:#3B443C;
    --encre:#E8EEE5; --encre2:#C1CBBF; --sourdine:#8D998C;
    --vert:#83BB99; --vert-fond:#1C2921; --vert-trait:#31503E;
    --laiton:#CCA95F; --laiton-fond:#282216; --laiton-trait:#514328;
    --ardoise:#93B5D0; --ardoise-fond:#192129; --ardoise-trait:#2F4253;
    --brique:#D2897F; --brique-fond:#291B19; --brique-trait:#543330;
    --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
    --ombre-haut:0 2px 6px rgba(0,0,0,.5), 0 24px 60px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --papier:#12160F; --carte:#191E19; --carte2:#1F251F; --voile:rgba(0,0,0,.6);
  --trait:#2B322C; --trait-fort:#3B443C;
  --encre:#E8EEE5; --encre2:#C1CBBF; --sourdine:#8D998C;
  --vert:#83BB99; --vert-fond:#1C2921; --vert-trait:#31503E;
  --laiton:#CCA95F; --laiton-fond:#282216; --laiton-trait:#514328;
  --ardoise:#93B5D0; --ardoise-fond:#192129; --ardoise-trait:#2F4253;
  --brique:#D2897F; --brique-fond:#291B19; --brique-trait:#543330;
  --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  --ombre-haut:0 2px 6px rgba(0,0,0,.5), 0 24px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--papier); color:var(--encre);
  font:400 15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:400}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--vert)}
:focus-visible{outline:2px solid var(--vert); outline-offset:2px; border-radius:3px}
.nb{font-variant-numeric:tabular-nums}

/* ---------- ossature ---------- */
.enveloppe{max-width:1240px; margin:0 auto; padding-inline:18px}
.fronton{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--papier) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--trait);
}
.fronton-int{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding-block:12px}
.marque{font:400 30px/1 var(--serif); letter-spacing:.2px; white-space:nowrap}
.marque em{font-style:italic; color:var(--vert)}
.onglets{display:flex; gap:2px; flex-wrap:wrap; margin-left:auto}
.onglet{
  border:0; background:transparent; color:var(--sourdine); cursor:pointer;
  padding:7px 12px; border-radius:var(--rm); font-size:14px; font-weight:500;
  display:inline-flex; align-items:center; gap:6px;
}
.onglet:hover{background:var(--carte2); color:var(--encre)}
.onglet[aria-selected="true"]{background:var(--carte); color:var(--encre); box-shadow:var(--ombre)}
.compteur{
  font:500 11px/1 var(--mono); background:var(--brique-fond); color:var(--brique);
  border:1px solid var(--brique-trait); border-radius:99px; padding:3px 6px;
}
.onglet[aria-selected="true"] .compteur{background:var(--brique); color:var(--carte); border-color:transparent}

/* ---------- ajout eclair ---------- */
.eclair{margin-block:18px 14px}
.eclair-boite{
  background:var(--carte); border:1px solid var(--trait); border-radius:var(--rl);
  box-shadow:var(--ombre); padding:14px 16px;
}
.eclair-titre{
  font:500 11px/1 var(--mono); letter-spacing:.09em; text-transform:uppercase;
  color:var(--sourdine); margin-bottom:9px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.eclair-rang{display:flex; gap:10px; align-items:stretch; flex-wrap:wrap}
#eclair-saisie{
  flex:1 1 320px; min-width:0; background:var(--carte2); border:1px solid var(--trait);
  border-radius:var(--rm); padding:11px 13px; font-size:15px;
}
#eclair-saisie::placeholder{color:var(--sourdine); opacity:.75}
#eclair-saisie:focus{border-color:var(--vert-trait); background:var(--carte)}
.jetons{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; min-height:0}
.jeton{
  font:400 12px/1 var(--mono); padding:4px 9px; border-radius:99px;
  background:var(--vert-fond); color:var(--vert); border:1px solid var(--vert-trait);
  display:inline-flex; gap:6px; align-items:center;
}
.jeton b{font-weight:500; opacity:.62; font-size:10px; letter-spacing:.06em; text-transform:uppercase}
.jeton.gris{background:var(--carte2); color:var(--sourdine); border-color:var(--trait)}

/* ---------- boutons ---------- */
.btn{
  border:1px solid var(--trait-fort); background:var(--carte); color:var(--encre);
  padding:10px 15px; border-radius:var(--rm); cursor:pointer; font-size:14px; font-weight:500;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--carte2); border-color:var(--sourdine)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-plein{background:var(--vert); border-color:var(--vert); color:var(--carte)}
:root[data-theme="dark"] .btn-plein, :root:not([data-theme="light"]) .btn-plein{color:#101610}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn-plein{color:#FBFCF9}}
.btn-plein:hover{background:var(--vert); border-color:var(--vert); filter:brightness(1.08)}
.btn-fin{padding:6px 10px; font-size:13px; border-radius:var(--rs)}
.btn-nu{border-color:transparent; background:transparent; color:var(--sourdine)}
.btn-nu:hover{background:var(--carte2); color:var(--encre); border-color:transparent}
.btn-risque:hover{background:var(--brique-fond); border-color:var(--brique-trait); color:var(--brique)}

/* ---------- indicateurs ---------- */
.indics{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:10px; margin-bottom:18px}
.indic{
  background:var(--carte); border:1px solid var(--trait); border-radius:var(--rm);
  padding:12px 14px; display:flex; flex-direction:column; gap:3px; min-width:0;
}
.indic-lib{font:500 10px/1.3 var(--mono); letter-spacing:.09em; text-transform:uppercase; color:var(--sourdine)}
.indic-val{font:400 27px/1.15 var(--serif); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.indic-note{font-size:12.5px; color:var(--sourdine); overflow-wrap:anywhere}
.indic.souligne{border-color:var(--vert-trait); background:var(--vert-fond)}
.indic.souligne .indic-val{color:var(--vert)}
.indic.alerte{border-color:var(--brique-trait); background:var(--brique-fond)}
.indic.alerte .indic-val{color:var(--brique)}

/* ---------- filtres ---------- */
.filtres{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.champ-recherche{flex:1 1 220px; min-width:0; position:relative}
.champ-recherche input{width:100%; padding:9px 13px; border:1px solid var(--trait); border-radius:var(--rm); background:var(--carte)}
select.mini, input.mini{
  padding:9px 11px; border:1px solid var(--trait); border-radius:var(--rm);
  background:var(--carte); font-size:14px; max-width:100%;
}

/* ---------- liste des mariages ---------- */
.liste{display:flex; flex-direction:column; gap:8px; list-style:none; margin:0 0 24px; padding:0}
.ligne{
  background:var(--carte); border:1px solid var(--trait); border-radius:var(--rm);
  padding:12px 14px; display:grid; gap:4px 14px; cursor:pointer;
  grid-template-columns:76px minmax(0,1fr); align-items:center; text-align:left; width:100%;
  font:inherit; color:inherit; transition:border-color .12s, box-shadow .12s;
}
.ligne:hover{border-color:var(--trait-fort); box-shadow:var(--ombre)}
.ligne:focus-visible{outline:2px solid var(--vert); outline-offset:1px}
.cartouche{
  grid-row:span 2; text-align:center; border-right:1px solid var(--trait); padding-right:12px;
  align-self:stretch; display:flex; flex-direction:column; justify-content:center; gap:1px;
}
.cartouche-j{font:400 26px/1 var(--serif); font-variant-numeric:tabular-nums}
.cartouche-m{font:500 10px/1.2 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--sourdine)}
.cartouche-a{font:400 11px/1.2 var(--mono); color:var(--sourdine)}
.ligne-haut{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; min-width:0}
.couple{font:400 21px/1.2 var(--serif); min-width:0; overflow-wrap:anywhere}
.ligne-bas{display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; font-size:13px; color:var(--sourdine); min-width:0}
.ligne-bas .sous{display:inline-flex; align-items:center; gap:5px; min-width:0}
.montant{font:500 14px/1 var(--mono); color:var(--encre2); font-variant-numeric:tabular-nums}
.pastille{
  font:500 11px/1 var(--mono); letter-spacing:.04em; padding:4px 8px; border-radius:99px;
  border:1px solid; white-space:nowrap;
}
.p-vert{background:var(--vert-fond); color:var(--vert); border-color:var(--vert-trait)}
.p-laiton{background:var(--laiton-fond); color:var(--laiton); border-color:var(--laiton-trait)}
.p-ardoise{background:var(--ardoise-fond); color:var(--ardoise); border-color:var(--ardoise-trait)}
.p-brique{background:var(--brique-fond); color:var(--brique); border-color:var(--brique-trait)}
.p-neutre{background:var(--carte2); color:var(--sourdine); border-color:var(--trait)}
.compte-a-rebours{font:500 11px/1 var(--mono); color:var(--vert); white-space:nowrap}
.compte-a-rebours.passe{color:var(--sourdine)}
.compte-a-rebours.proche{color:var(--brique)}
@media (max-width:620px){
  .ligne{grid-template-columns:62px minmax(0,1fr)}
  .cartouche-j{font-size:22px}
  .couple{font-size:19px}
}
.vide{
  text-align:center; padding:46px 20px; color:var(--sourdine);
  border:1px dashed var(--trait-fort); border-radius:var(--rl); background:var(--carte);
}
.vide h3{font:400 22px/1.3 var(--serif); color:var(--encre); margin-bottom:6px}

/* ---------- tableur ---------- */
.cadre-table{
  overflow-x:auto; border:1px solid var(--trait); border-radius:var(--rm);
  background:var(--carte); margin-bottom:0;
}
table.grille{border-collapse:collapse; width:100%; min-width:900px; font-size:13.5px}
table.grille th, table.grille td{
  padding:9px 11px; text-align:left; border-bottom:1px solid var(--trait); white-space:nowrap;
}
table.grille thead th{
  position:sticky; top:0; background:var(--carte2); z-index:2;
  font:500 10.5px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase;
  color:var(--sourdine); cursor:pointer; user-select:none; border-bottom:1px solid var(--trait-fort);
}
table.grille thead th:hover{color:var(--encre)}
table.grille thead th.nontri{cursor:default}
table.grille thead th .fleche{opacity:.45; font-size:9px; margin-left:3px}
table.grille td.num, table.grille th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
table.grille tbody tr{cursor:pointer}
table.grille tbody tr:hover{background:var(--carte2)}
table.grille tbody tr.choisie{background:var(--vert-fond)}
table.grille tbody tr:last-child td{border-bottom:0}
table.grille td.nom{white-space:normal; min-width:150px; font-weight:500}
.case-choix{width:34px; text-align:center}
.case-choix input{width:15px; height:15px; accent-color:var(--vert); cursor:pointer}
.barre-somme{
  position:sticky; bottom:0; display:flex; gap:8px 22px; flex-wrap:wrap; align-items:center;
  background:var(--carte2); border:1px solid var(--trait); border-top:0;
  border-radius:0 0 var(--rm) var(--rm); padding:11px 14px; margin-bottom:24px; font-size:13px;
}
.barre-somme .bs{display:inline-flex; align-items:baseline; gap:7px}
.barre-somme .bs-lib{font:500 10px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--sourdine)}
.barre-somme .bs-val{font:500 15px/1 var(--mono); font-variant-numeric:tabular-nums}
.barre-somme .bs-val.vert{color:var(--vert)}

/* ---------- analyse ---------- */
.bloc{background:var(--carte); border:1px solid var(--trait); border-radius:var(--rl); padding:18px; margin-bottom:16px}
.bloc-titre{
  font:500 10.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--sourdine); margin-bottom:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;
}
.bloc-titre .btn{margin-left:auto}
.segments{display:flex; gap:3px; flex-wrap:wrap; background:var(--carte2); padding:3px; border-radius:var(--rm); border:1px solid var(--trait)}
.segment{border:0; background:transparent; color:var(--sourdine); padding:6px 11px; border-radius:var(--rs); cursor:pointer; font-size:13px; font-weight:500}
.segment[aria-pressed="true"]{background:var(--carte); color:var(--encre); box-shadow:var(--ombre)}
.graphe{display:flex; align-items:flex-end; gap:2px; height:190px; position:relative; padding-top:22px}
.graphe-grille{position:absolute; inset:22px 0 20px 0; pointer-events:none}
.graphe-grille span{position:absolute; left:0; right:0; border-top:1px dashed var(--trait); font:400 10px/1 var(--mono); color:var(--sourdine); padding-left:2px}
.colonne{flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%; position:relative}
.barre{
  width:min(100%,46px); background:var(--vert); border-radius:4px 4px 0 0; min-height:2px;
  transition:filter .12s; position:relative;
}
.colonne:hover .barre{filter:brightness(1.15)}
.colonne.zero .barre{background:var(--trait-fort)}
.colonne-lib{font:400 10.5px/1 var(--mono); color:var(--sourdine); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.colonne-val{
  position:absolute; top:-20px; font:500 11px/1 var(--mono); color:var(--encre2);
  white-space:nowrap; opacity:0; transition:opacity .12s;
}
.colonne.pic .colonne-val, .colonne:hover .colonne-val{opacity:1}
.legende-graphe{font-size:12px; color:var(--sourdine); margin-top:10px}
.cadre-mini{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-inline:-2px; padding-inline:2px}
.mini-table{width:100%; min-width:430px; border-collapse:collapse; font-size:13.5px}
.mini-table th, .mini-table td{padding:8px 10px; border-bottom:1px solid var(--trait); text-align:left}
.mini-table th{font:500 10px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--sourdine)}
.mini-table td.num, .mini-table th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
.mini-table tr.total td{border-top:1px solid var(--trait-fort); border-bottom:0; font-weight:600; background:var(--carte2)}
.mini-table tbody tr:last-child td{border-bottom:0}
.duo{display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:16px}
.jauge{height:5px; background:var(--carte2); border-radius:99px; overflow:hidden; min-width:54px; border:1px solid var(--trait)}
.jauge i{display:block; height:100%; background:var(--vert)}

/* ---------- a faire ---------- */
.groupe-titre{
  font:500 10.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--sourdine); margin:20px 0 9px; display:flex; align-items:center; gap:9px;
}
.groupe-titre.urgent{color:var(--brique)}
.tache{
  display:flex; gap:11px; align-items:flex-start; background:var(--carte);
  border:1px solid var(--trait); border-radius:var(--rm); padding:11px 13px; margin-bottom:7px;
}
.tache.retard{border-left:3px solid var(--brique)}
.tache.info{border-left:3px solid var(--laiton)}
.tache input[type=checkbox]{width:17px; height:17px; margin-top:2px; accent-color:var(--vert); cursor:pointer; flex:none}
.tache-corps{flex:1 1 auto; min-width:0}
.tache-lib{font-size:14.5px; overflow-wrap:anywhere}
.tache-meta{font-size:12.5px; color:var(--sourdine); margin-top:2px; display:flex; gap:5px 11px; flex-wrap:wrap; align-items:center}
.tache-meta .qui{cursor:pointer; text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--trait-fort)}
.tache-meta .qui:hover{color:var(--encre)}
.tache-date{font:500 11px/1 var(--mono); color:var(--sourdine); white-space:nowrap; flex:none; padding-top:3px}
.tache-date.retard{color:var(--brique)}

/* ---------- agenda ---------- */
.mois-grille{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px}
.mois{background:var(--carte); border:1px solid var(--trait); border-radius:var(--rm); padding:12px 13px; min-height:96px}
.mois.plein{border-color:var(--vert-trait)}
.mois h3{
  font:500 10.5px/1 var(--mono); letter-spacing:.09em; text-transform:uppercase;
  color:var(--sourdine); margin-bottom:9px; display:flex; justify-content:space-between; gap:8px;
}
.mois.plein h3{color:var(--vert)}
.evt{display:flex; gap:9px; align-items:baseline; padding:5px 0; border-top:1px solid var(--trait); cursor:pointer; font-size:13.5px}
.evt:first-of-type{border-top:0}
.evt:hover .evt-nom{color:var(--vert)}
.evt-j{font:500 11px/1.4 var(--mono); color:var(--sourdine); flex:none; width:38px}
.evt-nom{min-width:0; overflow-wrap:anywhere}
.evt-pt{width:6px; height:6px; border-radius:99px; flex:none; align-self:center}

/* ---------- reglages ---------- */
.reglage-rang{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:11px 0; border-bottom:1px solid var(--trait)}
.reglage-rang:last-child{border-bottom:0}
.reglage-lib{flex:1 1 240px; min-width:0}
.reglage-lib b{font-weight:500; display:block; font-size:14.5px}
.reglage-lib span{font-size:12.5px; color:var(--sourdine)}
.reglage-rang input[type=number], .reglage-rang input[type=text], .reglage-rang select{
  width:132px; padding:8px 10px; border:1px solid var(--trait); border-radius:var(--rm); background:var(--carte2);
}
.listes-modif{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
.etiq{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:5px 9px;
  background:var(--carte2); border:1px solid var(--trait); border-radius:99px;
}
.etiq button{border:0; background:transparent; color:var(--sourdine); cursor:pointer; padding:0 1px; font-size:15px; line-height:1}
.etiq button:hover{color:var(--brique)}
textarea.modele{
  width:100%; min-height:128px; padding:11px 13px; border:1px solid var(--trait);
  border-radius:var(--rm); background:var(--carte2); font:400 13.5px/1.6 var(--sans); resize:vertical;
}
.etat-connecteur{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:11px 0; border-bottom:1px solid var(--trait)}
.etat-connecteur:last-child{border-bottom:0}
.voyant{width:8px; height:8px; border-radius:99px; background:var(--trait-fort); flex:none}
.voyant.ok{background:var(--vert)}
.voyant.ko{background:var(--brique)}
.voyant.attente{background:var(--laiton)}

/* ---------- fiche laterale ---------- */
.fond-fiche{position:fixed; inset:0; background:var(--voile); z-index:40; animation:apparait .15s ease}
@keyframes apparait{from{opacity:0}to{opacity:1}}
.fiche{
  position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); z-index:41;
  background:var(--papier); border-left:1px solid var(--trait); box-shadow:var(--ombre-haut);
  display:flex; flex-direction:column; animation:glisse .18s ease;
}
@keyframes glisse{from{transform:translateX(22px); opacity:.4}to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){.fiche,.fond-fiche{animation:none}}
.fiche-tete{
  padding:14px 18px calc(14px + env(safe-area-inset-top,0px)); padding-top:calc(14px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--trait); background:var(--carte); display:flex; gap:12px; align-items:flex-start;
}
.fiche-tete h2{font:400 26px/1.15 var(--serif); flex:1 1 auto; min-width:0; overflow-wrap:anywhere}
.fiche-corps{flex:1 1 auto; overflow-y:auto; padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch}
.fiche-pied{
  border-top:1px solid var(--trait); background:var(--carte); padding:11px 18px;
  padding-bottom:calc(11px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
}
.section{margin-bottom:20px}
.section > h3{
  font:500 10.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--sourdine); margin-bottom:10px; padding-bottom:7px; border-bottom:1px solid var(--trait);
  display:flex; align-items:center; gap:9px;
}
.grille-champs{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.champ{display:flex; flex-direction:column; gap:4px; min-width:0}
.champ.large{grid-column:1/-1}
.champ label{font:500 10px/1.3 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--sourdine)}
.champ input, .champ select, .champ textarea{
  width:100%; padding:9px 11px; border:1px solid var(--trait); border-radius:var(--rm);
  background:var(--carte); font-size:14.5px;
}
.champ textarea{min-height:88px; resize:vertical; line-height:1.55}
.champ input:focus, .champ select:focus, .champ textarea:focus{border-color:var(--vert-trait)}
.champ .aide{font-size:11.5px; color:var(--sourdine)}
.calcul{
  background:var(--carte2); border:1px solid var(--trait); border-radius:var(--rm);
  padding:11px 13px; display:flex; flex-direction:column; gap:7px; margin-top:10px;
}
.calcul-rang{display:flex; justify-content:space-between; gap:12px; font-size:13.5px; align-items:baseline}
.calcul-rang b{font:500 14px/1 var(--mono); font-variant-numeric:tabular-nums}
.calcul-rang.fort{border-top:1px solid var(--trait-fort); padding-top:7px}
.calcul-rang.fort b{font-size:16px; color:var(--vert)}
.calcul-rang.du b{color:var(--brique)}
.puces{display:flex; gap:6px; flex-wrap:wrap}
.puce{
  font-size:13px; padding:6px 11px; border-radius:99px; border:1px solid var(--trait);
  background:var(--carte); cursor:pointer; color:var(--sourdine);
}
.puce[aria-pressed="true"]{background:var(--vert-fond); border-color:var(--vert-trait); color:var(--vert); font-weight:500}
.mini-rang{
  display:flex; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--trait); font-size:13.5px;
}
.mini-rang:last-of-type{border-bottom:0}
.mini-rang .grandit{flex:1 1 auto; min-width:0; overflow-wrap:anywhere}
.mini-rang .mont{font:500 13.5px/1 var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.mini-rang input{padding:6px 9px; border:1px solid var(--trait); border-radius:var(--rs); background:var(--carte); font-size:13.5px; min-width:0}
.mini-rang .sup{border:0; background:transparent; color:var(--sourdine); cursor:pointer; font-size:16px; line-height:1; padding:2px 4px; flex:none}
.mini-rang .sup:hover{color:var(--brique)}
.avert{
  display:flex; gap:9px; align-items:flex-start; background:var(--brique-fond); color:var(--brique);
  border:1px solid var(--brique-trait); border-radius:var(--rm); padding:10px 12px; font-size:13.5px; margin-bottom:12px;
}
.avert.doux{background:var(--laiton-fond); color:var(--laiton); border-color:var(--laiton-trait)}
.avert.calme{background:var(--ardoise-fond); color:var(--ardoise); border-color:var(--ardoise-trait)}
.avert b{font-weight:600}
.actions-rang{display:flex; gap:7px; flex-wrap:wrap}
.resultat-mcp{font-size:13px; color:var(--sourdine); margin-top:9px; overflow-wrap:anywhere}
.resultat-mcp ul{margin:6px 0 0; padding-left:17px}
.resultat-mcp li{margin-bottom:3px}

/* ---------- divers ---------- */
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:60;
  background:var(--encre); color:var(--papier); padding:11px 17px; border-radius:99px;
  font-size:14px; box-shadow:var(--ombre-haut); max-width:calc(100% - 36px); text-align:center;
}
.badge-stockage{font:400 11px/1 var(--mono); color:var(--sourdine); display:inline-flex; align-items:center; gap:6px}
.pied{
  padding:22px 0 34px; color:var(--sourdine); font-size:12.5px;
  border-top:1px solid var(--trait); margin-top:8px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;
}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>
</head>
<body>
<header class="fronton">
  <div class="enveloppe fronton-int">
    <div class="marque">Carnet de <em>mariages</em></div>
    <nav class="onglets" role="tablist" id="onglets">
      <button class="onglet" role="tab" data-vue="mariages" aria-selected="true">Mariages</button>
      <button class="onglet" role="tab" data-vue="tableur" aria-selected="false">Tableau</button>
      <button class="onglet" role="tab" data-vue="analyse" aria-selected="false">Analyse</button>
      <button class="onglet" role="tab" data-vue="afaire" aria-selected="false">À faire <span class="compteur" id="compteur-afaire" hidden>0</span></button>
      <button class="onglet" role="tab" data-vue="agenda" aria-selected="false">Agenda</button>
      <button class="onglet" role="tab" data-vue="reglages" aria-selected="false">Réglages</button>
    </nav>
  </div>
</header>

<main class="enveloppe">

  <section class="eclair">
    <div class="eclair-boite">
      <div class="eclair-titre">
        <span>Ajout éclair</span>
        <span style="text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:12.5px">Colle une ligne, tout est reconnu tout seul.</span>
      </div>
      <div class="eclair-rang">
        <input id="eclair-saisie" type="text" autocomplete="off" spellcheck="false"
               placeholder="Camille &amp; Théo · 13/06/2026 · Château de Rambures · 06 12 34 56 78 · 3400 € · 120 invités">
        <button class="btn btn-plein" id="eclair-ajout">Ajouter</button>
        <button class="btn" id="eclair-vide" title="Créer une fiche vierge">Fiche vierge</button>
      </div>
      <div class="jetons" id="eclair-jetons"></div>
    </div>
  </section>

  <div class="indics" id="indicateurs"></div>

  <!-- ====== vue mariages ====== -->
  <section id="vue-mariages">
    <div class="filtres">
      <div class="champ-recherche">
        <input type="search" id="recherche" placeholder="Chercher un nom, un lieu, une ville, un téléphone…" autocomplete="off">
      </div>
      <select class="mini" id="f-statut" aria-label="Filtrer par statut"></select>
      <select class="mini" id="f-annee" aria-label="Filtrer par année"></select>
      <select class="mini" id="f-tri" aria-label="Trier">
        <option value="date-asc">Date croissante</option>
        <option value="date-desc">Date décroissante</option>
        <option value="prix-desc">Prix décroissant</option>
        <option value="reste-desc">Reste à encaisser</option>
        <option value="maj-desc">Modifiés récemment</option>
      </select>
    </div>
    <ul class="liste" id="liste"></ul>
  </section>

  <!-- ====== vue tableur ====== -->
  <section id="vue-tableur" hidden>
    <div class="filtres">
      <div class="champ-recherche">
        <input type="search" id="recherche2" placeholder="Filtrer les lignes…" autocomplete="off">
      </div>
      <select class="mini" id="f-statut2" aria-label="Filtrer par statut"></select>
      <select class="mini" id="f-annee2" aria-label="Filtrer par année"></select>
      <button class="btn" id="tout-cocher">Tout cocher</button>
      <button class="btn" id="rien-cocher">Rien cocher</button>
      <button class="btn" id="export-csv">Exporter en CSV</button>
    </div>
    <div class="cadre-table"><table class="grille" id="grille"></table></div>
    <div class="barre-somme" id="barre-somme"></div>
  </section>

  <!-- ====== vue analyse ====== -->
  <section id="vue-analyse" hidden></section>

  <!-- ====== vue a faire ====== -->
  <section id="vue-afaire" hidden></section>

  <!-- ====== vue agenda ====== -->
  <section id="vue-agenda" hidden></section>

  <!-- ====== vue reglages ====== -->
  <section id="vue-reglages" hidden></section>

  <footer class="pied">
    <span class="badge-stockage" id="badge-stockage"></span>
    <span id="pied-compte"></span>
  </footer>
</main>

<div id="zone-fiche"></div>
<div id="zone-toast"></div>
<script>
"use strict";
/* =======================================================================
   Carnet de mariages — base de données, calculs et automatisations
   ======================================================================= */

/* ---------- constantes ---------- */
const STATUTS = {
  demande:  {l:'Demande',      c:'p-ardoise'},
  devis:    {l:'Devis envoyé', c:'p-ardoise'},
  option:   {l:'Option posée', c:'p-laiton'},
  confirme: {l:'Confirmé',     c:'p-vert'},
  termine:  {l:'Terminé',      c:'p-neutre'},
  annule:   {l:'Annulé',       c:'p-brique'}
};
const ORDRE_STATUTS = ['demande','devis','option','confirme','termine','annule'];
const COMPTE_CA = ['confirme','termine'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_PLATS = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
const MOIS_COURTS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

const REGLAGES_DEFAUT = {
  acomptePct: 30,
  soldeJours: 30,
  relanceJours: 7,
  tarifCible: 60,
  formules: [
    {nom:'Essentielle', prix:1500, heures:12},
    {nom:'Complète',    prix:2400, heures:20},
    {nom:'Prestige',    prix:3600, heures:32}
  ],
  prestations: ['Préparatifs','Mairie','Cérémonie','Photos de couple','Cocktail','Repas','Soirée','Album','Drone'],
  sources: ['Bouche à oreille','Instagram','Site web','Salon du mariage','Recommandation du lieu','Mariages.net','Autre'],
  modeleTaches: [
    {label:'Envoyer le devis',                    offset:-240},
    {label:'Relancer si pas de réponse',          offset:-225},
    {label:'Contrat signé + acompte encaissé',    offset:-180},
    {label:'Repérage du lieu',                    offset:-60},
    {label:'Rendez-vous de préparation',          offset:-30},
    {label:'Encaisser le solde',                  offset:-30},
    {label:'Valider le déroulé de la journée',    offset:-14},
    {label:'Confirmer les horaires avec le lieu', offset:-7},
    {label:'Livraison',                           offset:45},
    {label:'Message de remerciement',             offset:60}
  ],
  modeleTemps: [
    {libelle:'Rendez-vous et échanges', heures:3},
    {libelle:'Repérage',                heures:2},
    {libelle:'Journée du mariage',      heures:10},
    {libelle:'Post-production',         heures:12}
  ],
  modeleFrais: [],
  calendrier: 'primary',
  signature: '',
  modeles: {
    devis: "Bonjour {prenoms},\n\nMerci beaucoup pour votre message : c'est avec grand plaisir que je note la date du {date}{lieuPhrase}.\n\nVoici ma proposition :\n{prestationsListe}\nTarif : {prix}\nAcompte à la réservation : {acompte} ({acomptePct} %)\nSolde : {solde}, à régler au plus tard le {dateSolde}.\n\nLa date reste ouverte tant que le contrat n'est pas signé. Dites-moi si vous souhaitez qu'on en discute de vive voix.\n\nBien à vous,\n{signature}",
    relance: "Bonjour {prenoms},\n\nJe reviens vers vous au sujet de votre mariage du {date}. J'ai toujours la date de libre, mais je préfère vous prévenir : j'ai d'autres demandes sur cette période.\n\nSouhaitez-vous que je maintienne l'option encore quelques jours ?\n\nBien à vous,\n{signature}",
    confirmation: "Bonjour {prenoms},\n\nC'est noté, votre date du {date} est réservée : merci pour votre confiance.\n\nRécapitulatif :\n- Date : {date}\n- Lieu : {lieu}\n- Prestation : {prix}\n- Acompte reçu : {acompte}\n- Solde de {solde} à régler avant le {dateSolde}\n\nJe reviens vers vous vers {dateRdv} pour caler le déroulé de la journée.\n\nBien à vous,\n{signature}",
    solde: "Bonjour {prenoms},\n\nPlus que {jours} jours avant le grand jour !\n\nPetit point pratique : il reste {solde} à régler avant le {dateSolde}.\n\nDites-moi si vous avez la moindre question sur le déroulé.\n\nBien à vous,\n{signature}"
  }
};

const MARIAGE_VIDE = () => ({
  id:'', cree:'', maj:'', statut:'demande',
  a:'', b:'', date:'', heureDebut:'', heureFin:'',
  tel:'', email:'', adresse:'',
  lieuNom:'', lieuAdresse:'', lieuCp:'', lieuVille:'', lieuTel:'', lieuContact:'',
  ceremonieLieu:'', ceremonieHeure:'', mairieHeure:'',
  invites:null, formule:'', prestations:[],
  prix:0, deplacement:0,
  frais:[], temps:[], paiements:[],
  source:'', demandeLe:'', devisLe:'', contratLe:'',
  notes:'', taches:[], gcalLien:''
});

/* ---------- petits utilitaires ---------- */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const e = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nb = v => { const n = parseFloat(String(v==null?'':v).replace(/\s| /g,'').replace(',','.')); return isFinite(n) ? n : 0; };

const nf0 = new Intl.NumberFormat('fr-FR', {maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('fr-FR', {maximumFractionDigits:1});
const euro = n => nf0.format(Math.round(n||0)) + ' €';
const heures = n => (Math.round((n||0)*10)/10 === Math.round(n||0) ? nf0.format(n||0) : nf1.format(n||0)) + ' h';

const jourDe = iso => { const p = String(iso||'').split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const isoDe  = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const iso3   = (y,m,d) => y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
const aujourdhui = () => isoDe(new Date());
const estDate = iso => /^\d{4}-\d{2}-\d{2}$/.test(String(iso||''));
const plusJours = (iso, n) => { const d = jourDe(iso); d.setDate(d.getDate() + n); return isoDe(d); };
const ecartJours = (a, b) => Math.round((jourDe(b) - jourDe(a)) / 86400000);
const versAujourdhui = iso => estDate(iso) ? ecartJours(aujourdhui(), iso) : null;

const fmtLong  = iso => estDate(iso) ? jourDe(iso).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : '—';
const fmtMoyen = iso => estDate(iso) ? jourDe(iso).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtCourt = iso => estDate(iso) ? jourDe(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '';

const ACCENTS = 'àáâãäåçèéêëìíîïñòóôõöùúûüýÿÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜÝ';
const SANS    = 'aaaaaaceeeeiiiinooooouuuuyyAAAAAACEEEEIIIINOOOOOUUUUY';
const aplati = s => String(s==null?'':s).replace(/./g, c => { const i = ACCENTS.indexOf(c); return i < 0 ? c : SANS[i]; });
const norm = s => aplati(s).toLowerCase().replace(/\s+/g,' ').trim();
const capi = s => String(s||'').replace(/(^|[\s'’\-])([a-zà-ÿ])/g, (m,p,c) => p + c.toUpperCase());

function fmtTel(t){
  let d = String(t||'').replace(/[^\d+]/g,'');
  if (/^\+33\d{9}$/.test(d)) d = '0' + d.slice(3);
  if (/^0\d{9}$/.test(d)) return d.replace(/(\d{2})(?=\d)/g, '$1 ');
  return String(t||'').trim();
}
const couple = m => [m.a, m.b].filter(Boolean).join(' & ') || 'Sans nom';
const lieuCourt = m => [m.lieuNom, m.lieuVille].filter(Boolean).join(', ');

/* ---------- calculs dérivés ---------- */
function calc(m){
  const prix = nb(m.prix), depl = nb(m.deplacement);
  const total = prix + depl;
  const encaisse  = (m.paiements||[]).reduce((s,p) => s + nb(p.montant), 0);
  const fraisTot  = (m.frais||[]).reduce((s,f) => s + nb(f.montant), 0);
  const heuresTot = (m.temps||[]).reduce((s,t) => s + nb(t.heures), 0);
  const acompteDu = Math.round(total * nb(Etat.reglages.acomptePct) / 100);
  const benefice  = total - fraisTot;
  return {
    prix, depl, total, encaisse, fraisTot, heuresTot, acompteDu,
    reste: total - encaisse,
    benefice,
    tauxHoraire: heuresTot > 0 ? benefice / heuresTot : null,
    marge: total > 0 ? benefice / total : null,
    jours: versAujourdhui(m.date),
    dateSolde: estDate(m.date) ? plusJours(m.date, -nb(Etat.reglages.soldeJours)) : ''
  };
}

/* ---------- état global ---------- */
const Etat = {
  mariages: new Map(),
  reglages: JSON.parse(JSON.stringify(REGLAGES_DEFAUT)),
  vue: 'mariages',
  ficheId: null,
  edition: false,
  choix: new Set(),
  tri: {col:'date', sens:1},
  periode: {mode:'annee', de:'', a:'', statuts:['confirme','termine']},
  anneeAgenda: new Date().getFullYear(),
  mcp: null, telech: null, connecteurs: {}
};

/* ---------- stockage : nuage (db) ou local ---------- */
const Stock = {
  mode: 'memoire', db: null, files: new Map(), pret: false,

  async init(){
    let db = null;
    try { db = window.claude && claude.use ? await claude.use('db') : null; } catch(_){ db = null; }
    if (db){
      this.db = db; this.mode = 'nuage';
      try {
        db.collection('mariages').onSnapshot(snap => {
          Etat.mariages = new Map();
          snap.docs.forEach(d => { const v = d.data(); if (v) Etat.mariages.set(d.id, Object.assign(MARIAGE_VIDE(), v, {id:d.id})); });
          this.pret = true; rendreTout();
        }, err => { annonce('Synchronisation interrompue (' + err.code + ')'); });
        db.doc('config/reglages').onSnapshot(snap => {
          if (snap.exists){
            const v = snap.data() || {};
            Etat.reglages = Object.assign(JSON.parse(JSON.stringify(REGLAGES_DEFAUT)), v,
              {modeles: Object.assign({}, REGLAGES_DEFAUT.modeles, v.modeles || {})});
          }
          rendreTout();
        }, () => {});
      } catch(_){}
      return;
    }
    try {
      const brut = localStorage.getItem('carnet-mariages-v1');
      if (brut){
        const d = JSON.parse(brut);
        (d.mariages||[]).forEach(m => Etat.mariages.set(m.id, Object.assign(MARIAGE_VIDE(), m)));
        if (d.reglages) Etat.reglages = Object.assign(JSON.parse(JSON.stringify(REGLAGES_DEFAUT)), d.reglages,
          {modeles: Object.assign({}, REGLAGES_DEFAUT.modeles, d.reglages.modeles || {})});
      }
      this.mode = 'local';
    } catch(_){ this.mode = 'memoire'; }
    this.pret = true;
  },

  sauveLocal(){
    if (this.mode !== 'local') return;
    try {
      localStorage.setItem('carnet-mariages-v1', JSON.stringify({
        mariages: Array.from(Etat.mariages.values()), reglages: Etat.reglages
      }));
    } catch(_){ annonce('Sauvegarde impossible : espace de stockage plein.'); }
  },

  async ecrire(id){
    const m = Etat.mariages.get(id);
    if (!m) return;
    m.maj = new Date().toISOString();
    if (this.mode !== 'nuage') return this.sauveLocal();
    if (this.files.has(id)) { this.files.set(id, true); return; }
    this.files.set(id, false);
    try {
      while (true){
        const co = Etat.mariages.get(id);
        if (!co) break;
        await this.db.collection('mariages').doc(id).set(JSON.parse(JSON.stringify(co)));
        if (!this.files.get(id)) break;   // rien n'a bougé pendant l'écriture
        this.files.set(id, false);        // une modification est arrivée : on réécrit
      }
    } catch(err){ annonce(msgDb(err)); }
    finally { this.files.delete(id); }
  },

  async supprimer(id){
    Etat.mariages.delete(id);
    if (this.mode === 'nuage'){ try { await this.db.collection('mariages').doc(id).delete(); } catch(err){ annonce(msgDb(err)); } }
    else this.sauveLocal();
  },

  async ecrireReglages(){
    if (this.mode !== 'nuage') return this.sauveLocal();
    try { await this.db.doc('config/reglages').set(JSON.parse(JSON.stringify(Etat.reglages))); }
    catch(err){ annonce(msgDb(err)); }
  }
};

function msgDb(err){
  const c = err && err.code;
  if (c === 'quota_exceeded')    return 'Base pleine : supprime d’anciennes fiches avant d’en créer.';
  if (c === 'resource_exhausted') return 'Trop d’écritures d’un coup. Attends deux secondes et réessaie.';
  if (c === 'invalid_argument')   return 'Enregistrement refusé : tu n’as pas les droits d’écriture sur cette page.';
  if (c === 'revoked')            return 'Accès retiré pendant la session. Recharge la page.';
  return 'Enregistrement impossible pour le moment. Réessaie dans un instant.';
}

/* =======================================================================
   Ajout éclair : une ligne de texte libre → une fiche complète
   ======================================================================= */
const MOTS_LIEU = /(ch[âa]teau|domaine|manoir|bastide|abbaye|moulin|ferme|grange|salle|villa|h[ôo]tel|logis|prieur[ée]|orangerie|verger|parc|jardin|golf|cabane|g[îi]te|auberge|relais|pavillon|maison|mairie|[ée]glise|clos|mas\b)/i;
const MOTS_JOUR = /\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/i;

function anneeProbable(mois, jour){
  const now = new Date(), y = now.getFullYear();
  const candidat = new Date(y, mois-1, jour);
  const auj = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return candidat < auj ? y + 1 : y;
}

function analyser(txt){
  const out = {a:'', b:'', date:'', lieu:'', tel:'', email:'', prix:null, invites:null, cp:''};
  if (!String(txt||'').trim()) return out;
  let s = ' ' + String(txt).replace(/[ ]/g,' ').replace(/\s+/g,' ').trim() + ' ';

  const coupe = (re, surAplati) => {
    const cible = surAplati ? aplati(s) : s;
    const m = cible.match(re);
    if (!m) return null;
    s = s.slice(0, m.index) + ' § ' + s.slice(m.index + m[0].length);
    return m;
  };

  let m;
  if ((m = coupe(/[\w.+-]+@[\w-]+\.[a-z]{2,}/i))) out.email = m[0].toLowerCase();
  if ((m = coupe(/(?:\+33[ .\-]?|0)[1-9](?:[ .\-]?\d{2}){4}/))) out.tel = fmtTel(m[0]);

  if ((m = coupe(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/)))            out.date = iso3(+m[1], +m[2], +m[3]);
  else if ((m = coupe(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/))){
    let y = +m[3]; if (y < 100) y += 2000;
    out.date = iso3(y, +m[2], +m[1]);
  }
  else if ((m = coupe(new RegExp('\\b(\\d{1,2})(?:er)?\\s+(' + MOIS_PLATS.join('|') + ')\\.?(?:\\s+(\\d{4}))?', 'i'), true))){
    const mo = MOIS_PLATS.indexOf(m[2].toLowerCase()) + 1;
    const y = m[3] ? +m[3] : anneeProbable(mo, +m[1]);
    out.date = iso3(y, mo, +m[1]);
  }
  if (out.date && !estDate(out.date)) out.date = '';
  coupe(MOTS_JOUR, true);

  if ((m = coupe(/\b(\d{2,4})\s*(?:invit\w*|pers\w*|couverts?)\b/i))) out.invites = +m[1];

  if ((m = coupe(/(\d[\d  .]*\d|\d)\s*(?:€|eur(?:os?)?\b)/i))) out.prix = nb(String(m[1]).replace(/[ .]/g,''));
  else if ((m = coupe(/€\s*(\d[\d  .]*\d|\d)/)))               out.prix = nb(String(m[1]).replace(/[ .]/g,''));
  else if ((m = coupe(/(?:^|\s)(\d{3,6})(?=\s|$)/))){
    const n = +m[1];
    if (/^\d{5}$/.test(m[1]) && n >= 1000) out.cp = m[1];
    else if (n >= 150 && n <= 60000) out.prix = n;
  }

  const morceaux = s.split(/[§,;·|]+/)
    .map(x => x.replace(/^[\s.\-–]+|[\s.\-–]+$/g,''))
    .filter(x => x.length > 1);

  let iNoms = morceaux.findIndex(c => /\s(?:&|\+|et)\s/i.test(c) && !MOTS_LIEU.test(c));
  if (iNoms < 0) iNoms = morceaux.findIndex(c => /\s(?:&|\+|et)\s/i.test(c));
  if (iNoms >= 0){
    const parts = morceaux[iNoms].split(/\s*(?:&|\+|\bet\b)\s*/i).map(x => x.trim()).filter(Boolean);
    const gauche = String(parts[0] || '').split(/\s+/);
    const droite = String(parts[1] || '').split(/\s+/);
    out.a = capi(gauche.length > 2 ? gauche[gauche.length - 1] : gauche.join(' '));
    out.b = capi(droite.slice(0, 2).join(' '));
    morceaux.splice(iNoms, 1);
  }

  let iLieu = morceaux.findIndex(c => MOTS_LIEU.test(c));
  if (iLieu < 0) iLieu = morceaux.findIndex(c => /^(à|au|aux|chez)\s+/i.test(c));
  if (iLieu < 0 && morceaux.length) iLieu = morceaux.indexOf(morceaux.slice().sort((x,y) => y.length - x.length)[0]);
  if (iLieu >= 0){
    out.lieu = morceaux[iLieu].replace(/^(à|au|aux|chez)\s+/i,'').trim();
    morceaux.splice(iLieu, 1);
  }
  if (!out.a && morceaux.length) out.a = capi(morceaux.shift());
  return out;
}

/* ---------- carnet de lieux déduit des fiches ---------- */
function carnetLieux(){
  const carnet = new Map();
  Array.from(Etat.mariages.values())
    .sort((x,y) => String(x.maj||'').localeCompare(String(y.maj||'')))
    .forEach(m => {
      if (!m.lieuNom) return;
      const cle = norm(m.lieuNom);
      const p = carnet.get(cle) || {nom:m.lieuNom, adresse:'', cp:'', ville:'', tel:'', contact:'', fiches:[]};
      p.nom = m.lieuNom;
      ['adresse','cp','ville','tel','contact'].forEach(k => {
        const v = m['lieu' + k.charAt(0).toUpperCase() + k.slice(1)];
        if (v) p[k] = v;
      });
      p.fiches.push(m);
      carnet.set(cle, p);
    });
  return carnet;
}

function completerLieu(m){
  if (!m.lieuNom) return false;
  const p = carnetLieux().get(norm(m.lieuNom));
  if (!p) return false;
  let touche = false;
  [['lieuAdresse','adresse'], ['lieuCp','cp'], ['lieuVille','ville'], ['lieuTel','tel'], ['lieuContact','contact']]
    .forEach(([champ, cle]) => { if (!m[champ] && p[cle]){ m[champ] = p[cle]; touche = true; } });
  return touche;
}

/* ---------- génération et mise à jour des tâches ---------- */
function genererTaches(m){
  if (!estDate(m.date)) return;
  m.taches = m.taches || [];
  (Etat.reglages.modeleTaches || []).forEach(mod => {
    const existante = m.taches.find(t => t.label === mod.label && t.offset != null);
    const ech = plusJours(m.date, nb(mod.offset));
    if (existante){ if (!existante.fait) existante.echeance = ech; }
    else m.taches.push({id:uid(), label:mod.label, echeance:ech, offset:nb(mod.offset), fait:false});
  });
  m.taches.sort((x,y) => String(x.echeance).localeCompare(String(y.echeance)));
}

function appliquerFormule(m, nom){
  const f = (Etat.reglages.formules || []).find(x => x.nom === nom);
  if (!f) return;
  m.formule = nom;
  if (!nb(m.prix)) m.prix = nb(f.prix);
  if (!(m.temps || []).length && nb(f.heures)){
    m.temps = (Etat.reglages.modeleTemps || []).map(t => ({id:uid(), libelle:t.libelle, heures:nb(t.heures)}));
    const somme = m.temps.reduce((s,t) => s + t.heures, 0);
    if (!somme) m.temps = [{id:uid(), libelle:'Prestation', heures:nb(f.heures)}];
  }
}

/* ---------- conflits de date ---------- */
function conflits(m){
  if (!estDate(m.date) || m.statut === 'annule') return [];
  return Array.from(Etat.mariages.values())
    .filter(o => o.id !== m.id && o.date === m.date && o.statut !== 'annule');
}

/* ---------- alertes calculées ---------- */
function alertes(m){
  const c = calc(m), r = Etat.reglages, liste = [];
  const pousse = (t, txt, date, niveau) => liste.push({type:t, texte:txt, date:date || '', niveau:niveau || 'info', m});
  if (m.statut === 'annule' || m.statut === 'termine') return liste;

  if (!estDate(m.date)) pousse('date', 'Date à fixer', '', 'info');
  if (!m.tel && !m.email) pousse('contact', 'Aucun téléphone ni e-mail', '', 'info');
  if (conflits(m).length) pousse('conflit', 'Deux mariages le même jour (' + fmtCourt(m.date) + ')', m.date, 'urgent');

  if (m.statut === 'demande' && estDate(m.demandeLe)){
    const age = -versAujourdhui(m.demandeLe);
    if (age >= nb(r.relanceJours)) pousse('devis', 'Demande reçue il y a ' + age + ' jours, devis pas encore envoyé', m.demandeLe, 'urgent');
  }
  if ((m.statut === 'devis' || m.statut === 'option') && estDate(m.devisLe)){
    const age = -versAujourdhui(m.devisLe);
    if (age >= nb(r.relanceJours)) pousse('relance', 'Devis envoyé il y a ' + age + ' jours, sans réponse', m.devisLe, 'urgent');
  }
  if (m.statut === 'confirme'){
    if (!m.contratLe) pousse('contrat', 'Contrat non signé', '', 'info');
    if (c.encaisse < c.acompteDu) pousse('acompte', 'Acompte de ' + euro(c.acompteDu - c.encaisse) + ' pas encore encaissé', '', 'info');
    if (c.jours != null && c.jours <= nb(r.soldeJours) && c.reste > 0)
      pousse('solde', 'Solde de ' + euro(c.reste) + ' à encaisser avant le ' + fmtCourt(c.dateSolde), c.dateSolde, 'urgent');
    if (c.jours != null && c.jours < 0) pousse('bilan', 'Mariage passé : passer la fiche en « Terminé »', m.date, 'info');
  }
  if (c.jours != null && c.jours < 0 && c.reste > 0 && m.statut !== 'annule')
    pousse('impaye', 'Impayé de ' + euro(c.reste) + ' après le mariage', m.date, 'urgent');
  return liste;
}

function toutAFaire(){
  const items = [];
  Etat.mariages.forEach(m => {
    if (m.statut === 'annule') return;
    (m.taches || []).forEach(t => {
      if (t.fait) return;
      items.push({genre:'tache', id:t.id, texte:t.label, date:t.echeance || '', m, niveau:'tache'});
    });
    alertes(m).forEach(a => items.push({genre:'alerte', id:a.type, texte:a.texte, date:a.date, m, niveau:a.niveau}));
  });
  const auj = aujourdhui();
  items.forEach(i => { i.retard = i.date ? i.date < auj : (i.niveau === 'urgent'); });
  items.sort((x,y) => {
    if (x.retard !== y.retard) return x.retard ? -1 : 1;
    const dx = x.date || '9999', dy = y.date || '9999';
    return dx === dy ? String(x.texte).localeCompare(String(y.texte)) : dx.localeCompare(dy);
  });
  return items;
}
function nbAFaire(){
  const limite = plusJours(aujourdhui(), 21);
  return toutAFaire().filter(i => i.retard || !i.date || i.date <= limite).length;
}

/* =======================================================================
   Sélection, filtres et rendu des listes
   ======================================================================= */
function tousTries(){
  return Array.from(Etat.mariages.values()).sort((x,y) => {
    const dx = x.date || '9999-99-99', dy = y.date || '9999-99-99';
    return dx === dy ? String(x.cree).localeCompare(String(y.cree)) : dx.localeCompare(dy);
  });
}

function anneesDisponibles(){
  const s = new Set();
  Etat.mariages.forEach(m => { if (estDate(m.date)) s.add(m.date.slice(0,4)); });
  s.add(String(new Date().getFullYear()));
  return Array.from(s).sort();
}

function filtrer(recherche, statut, annee){
  const q = norm(recherche || '');
  return tousTries().filter(m => {
    if (statut && statut !== 'tous'){
      if (statut === 'actifs'){ if (!['demande','devis','option','confirme'].includes(m.statut)) return false; }
      else if (m.statut !== statut) return false;
    }
    if (annee && annee !== 'toutes' && String(m.date||'').slice(0,4) !== annee) return false;
    if (!q) return true;
    const foin = norm([m.a, m.b, m.lieuNom, m.lieuVille, m.lieuAdresse, m.tel, m.email, m.source, m.formule, m.notes, fmtCourt(m.date)].join(' '));
    return q.split(' ').every(mot => foin.includes(mot));
  });
}

function remplirSelects(){
  const selStatuts = ['<option value="actifs">En cours</option>', '<option value="tous">Tous les statuts</option>']
    .concat(ORDRE_STATUTS.map(k => '<option value="' + k + '">' + e(STATUTS[k].l) + '</option>')).join('');
  const selAnnees = ['<option value="toutes">Toutes les années</option>']
    .concat(anneesDisponibles().map(a => '<option value="' + a + '">' + a + '</option>')).join('');
  [['#f-statut', selStatuts], ['#f-statut2', selStatuts], ['#f-annee', selAnnees], ['#f-annee2', selAnnees]].forEach(([sel, html]) => {
    const el = $(sel); if (!el) return;
    const garde = el.value;
    el.innerHTML = html;
    if (garde && Array.from(el.options).some(o => o.value === garde)) el.value = garde;
  });
}

function rendreIndicateurs(){
  const auj = aujourdhui(), annee = String(new Date().getFullYear());
  const tous = Array.from(Etat.mariages.values());
  const prochain = tous.filter(m => estDate(m.date) && m.date >= auj && ['confirme','option'].includes(m.statut))
                       .sort((x,y) => x.date.localeCompare(y.date))[0];
  const delAnnee = tous.filter(m => String(m.date||'').slice(0,4) === annee && COMPTE_CA.includes(m.statut));
  const ca = delAnnee.reduce((s,m) => s + calc(m).total, 0);
  const heuresAn = delAnnee.reduce((s,m) => s + calc(m).heuresTot, 0);
  const reste = tous.filter(m => COMPTE_CA.includes(m.statut)).reduce((s,m) => s + Math.max(0, calc(m).reste), 0);
  const aFaire = nbAFaire();

  const cases = [];
  if (prochain){
    const j = versAujourdhui(prochain.date);
    cases.push({lib:'Prochain mariage', val: j === 0 ? "Aujourd'hui" : 'J−' + j, note: couple(prochain) + ' · ' + fmtMoyen(prochain.date), style:'souligne', id:prochain.id});
  } else {
    cases.push({lib:'Prochain mariage', val:'—', note:'Aucune date confirmée à venir'});
  }
  cases.push({lib:'Signés en ' + annee, val: String(delAnnee.length), note: delAnnee.length ? 'Panier moyen ' + euro(ca / delAnnee.length) : 'Rien de signé pour l’instant'});
  cases.push({lib:"Chiffre d'affaires " + annee, val: euro(ca), note: heuresAn ? heures(heuresAn) + ' de travail' : 'Heures non renseignées'});
  cases.push({lib:'Reste à encaisser', val: euro(reste), note: reste > 0 ? 'Sur les mariages signés' : 'Tout est réglé', style: reste > 0 ? '' : 'souligne'});
  cases.push({lib:'À faire', val: String(aFaire), note: aFaire ? 'Échéances et relances' : 'Rien d’urgent', style: aFaire ? 'alerte' : 'souligne', vue:'afaire'});

  $('#indicateurs').innerHTML = cases.map(c =>
    '<div class="indic ' + (c.style || '') + '"' + (c.id ? ' data-ouvre="' + e(c.id) + '" style="cursor:pointer"' : c.vue ? ' data-va="' + c.vue + '" style="cursor:pointer"' : '') + '>' +
      '<span class="indic-lib">' + e(c.lib) + '</span>' +
      '<span class="indic-val nb">' + e(c.val) + '</span>' +
      '<span class="indic-note">' + e(c.note) + '</span>' +
    '</div>').join('');

  const cpt = $('#compteur-afaire');
  cpt.textContent = String(aFaire);
  cpt.hidden = aFaire === 0;
}

function pastille(m){
  const s = STATUTS[m.statut] || STATUTS.demande;
  return '<span class="pastille ' + s.c + '">' + e(s.l) + '</span>';
}

function rendreListe(){
  const liste = filtrer($('#recherche').value, $('#f-statut').value, $('#f-annee').value);
  const tri = $('#f-tri').value;
  liste.sort((x,y) => {
    const cx = calc(x), cy = calc(y);
    if (tri === 'date-desc')  return String(y.date||'').localeCompare(String(x.date||''));
    if (tri === 'prix-desc')  return cy.total - cx.total;
    if (tri === 'reste-desc') return cy.reste - cx.reste;
    if (tri === 'maj-desc')   return String(y.maj||'').localeCompare(String(x.maj||''));
    return String(x.date||'9999').localeCompare(String(y.date||'9999'));
  });

  const el = $('#liste');
  const nbEx = Array.from(Etat.mariages.values()).filter(x => x.exemple).length;
  const banniere = nbEx
    ? '<li><div class="avert calme"><span>•</span><div style="flex:1 1 auto">' +
      nbEx + ' fiche' + (nbEx > 1 ? 's' : '') + ' d’exemple pour te montrer le fonctionnement — ' +
      '<button class="btn btn-fin" id="sup-exemples" style="margin-left:6px">Les supprimer</button></div></div></li>'
    : '';
  if (!liste.length){
    el.innerHTML = banniere + '<li><div class="vide"><h3>Aucune fiche ici</h3>' +
      '<p>Colle une ligne dans l’ajout éclair ci-dessus — nom, date, lieu, téléphone et prix sont reconnus tout seuls.</p></div></li>';
    return;
  }
  el.innerHTML = banniere + liste.map(m => {
    const c = calc(m), d = estDate(m.date) ? jourDe(m.date) : null;
    const conflit = conflits(m).length;
    let rebours = '', cls = '';
    if (c.jours != null){
      if (c.jours < 0){ rebours = 'passé'; cls = 'passe'; }
      else if (c.jours === 0){ rebours = "aujourd'hui"; cls = 'proche'; }
      else { rebours = 'J−' + c.jours; cls = c.jours <= 30 ? 'proche' : ''; }
    }
    return '<li><button class="ligne" data-ouvre="' + e(m.id) + '">' +
      '<span class="cartouche">' +
        (d ? '<span class="cartouche-j nb">' + d.getDate() + '</span><span class="cartouche-m">' + e(MOIS_COURTS[d.getMonth()]) + '</span><span class="cartouche-a nb">' + d.getFullYear() + '</span>'
           : '<span class="cartouche-m">date<br>à fixer</span>') +
      '</span>' +
      '<span class="ligne-haut"><span class="couple">' + e(couple(m)) + '</span>' + pastille(m) +
        (m.exemple ? '<span class="pastille p-neutre">Exemple</span>' : '') +
        (conflit ? '<span class="pastille p-brique">Doublon de date</span>' : '') +
        (rebours ? '<span class="compte-a-rebours ' + cls + '">' + e(rebours) + '</span>' : '') +
      '</span>' +
      '<span class="ligne-bas">' +
        (lieuCourt(m) ? '<span class="sous">' + e(lieuCourt(m)) + '</span>' : '<span class="sous">Lieu à définir</span>') +
        (m.tel ? '<span class="sous nb">' + e(m.tel) + '</span>' : '') +
        (c.total ? '<span class="sous"><span class="montant">' + e(euro(c.total)) + '</span>' +
            (c.reste > 0 && COMPTE_CA.includes(m.statut) ? ' <span style="color:var(--brique)">reste ' + e(euro(c.reste)) + '</span>' : '') + '</span>' : '') +
        (c.heuresTot ? '<span class="sous">' + e(heures(c.heuresTot)) + '</span>' : '') +
      '</span></button></li>';
  }).join('');
}

  {cle:'taux',     lib:'€ / heure',  num:true,  val:m => calc(m).tauxHoraire || 0, aff:m => { const t = calc(m).tauxHoraire; return t == null ? '—' : nf0.format(Math.round(t)) + ' €'; }},
  {cle:'source',   lib:'Source',     num:false, val:m => norm(m.source), aff:m => e(m.source || '—')}
];

function lignesTableur(){
  const l = filtrer($('#recherche2').value, $('#f-statut2').value, $('#f-annee2').value);

    const vx = col.val(x), vy = col.val(y);
    const r = (typeof vx === 'number' && typeof vy === 'number') ? vx - vy : String(vx).localeCompare(String(vy));
    return r * Etat.tri.sens;

}

/* =======================================================================
   Analyse : totaux sur une période, comme une feuille de calcul
   ======================================================================= */
function bornesPeriode(){
  const p = Etat.periode, an = new Date().getFullYear();
  if (p.mode === 'annee')     return {de: an + '-01-01',       a: an + '-12-31',       lib:'Année ' + an};
  if (p.mode === 'precedente')return {de: (an-1) + '-01-01',   a: (an-1) + '-12-31',   lib:'Année ' + (an-1)};
  if (p.mode === 'suivante')  return {de: (an+1) + '-01-01',   a: (an+1) + '-12-31',   lib:'Année ' + (an+1)};
  if (p.mode === 'douze')     return {de: plusJours(aujourdhui(), -365), a: aujourdhui(), lib:'12 derniers mois'};
  if (p.mode === 'perso')     return {de: p.de || '0000-01-01', a: p.a || '9999-12-31', lib:'Du ' + (fmtCourt(p.de) || '…') + ' au ' + (fmtCourt(p.a) || '…')};
  return {de:'0000-01-01', a:'9999-12-31', lib:'Depuis le début'};
}

function fichesPeriode(){
  const b = bornesPeriode();
  return Array.from(Etat.mariages.values()).filter(m =>
    estDate(m.date) && m.date >= b.de && m.date <= b.a && Etat.periode.statuts.includes(m.statut));
}

function cumul(liste){
  return liste.reduce((acc, m) => {
    const c = calc(m);
    acc.n++; acc.ca += c.total; acc.frais += c.fraisTot; acc.benef += c.benefice;
    acc.enc += c.encaisse; acc.reste += c.reste; acc.h += c.heuresTot;
    acc.depl += c.depl; acc.inv += nb(m.invites);
    return acc;
  }, {n:0, ca:0, frais:0, benef:0, enc:0, reste:0, h:0, depl:0, inv:0});
}

function repartition(liste, cle){
  const g = new Map();
  liste.forEach(m => {
    const k = (cle(m) || '').trim() || 'Non renseigné';
    const p = g.get(k) || {k, n:0, ca:0, benef:0, h:0};
    const c = calc(m);
    p.n++; p.ca += c.total; p.benef += c.benefice; p.h += c.heuresTot;
    g.set(k, p);
  });
  return Array.from(g.values()).sort((x,y) => y.ca - x.ca);
}

function tableRepartition(titre, lignes, total){
  if (!lignes.length) return '<div class="bloc"><div class="bloc-titre">' + e(titre) + '</div><p style="color:var(--sourdine); font-size:13.5px">Rien à afficher sur cette période.</p></div>';
  return '<div class="bloc"><div class="bloc-titre">' + e(titre) + '</div>' +
    '<div class="cadre-mini"><table class="mini-table"><thead><tr><th>' + e(titre) + '</th><th class="num">Nb</th><th class="num">CA</th><th class="num">Bénéfice</th><th class="num">Part</th></tr></thead><tbody>' +
    lignes.map(l => {
      const part = total ? Math.round(l.ca / total * 100) : 0;
      return '<tr><td>' + e(l.k) + '</td><td class="num">' + l.n + '</td><td class="num">' + e(euro(l.ca)) + '</td>' +
        '<td class="num">' + e(euro(l.benef)) + '</td>' +
        '<td class="num"><span style="display:inline-flex; align-items:center; gap:7px; justify-content:flex-end">' +
        '<span class="jauge" style="width:54px"><i style="width:' + part + '%"></i></span>' + part + ' %</span></td></tr>';
    }).join('') + '</tbody></table></div></div>';
}

function rendreAnalyse(){
  const b = bornesPeriode(), liste = fichesPeriode(), t = cumul(liste);
  const parMois = new Map();
  liste.forEach(m => {
    const k = m.date.slice(0,7);
    const p = parMois.get(k) || {k, n:0, ca:0, frais:0, benef:0, h:0};
    const c = calc(m);
    p.n++; p.ca += c.total; p.frais += c.fraisTot; p.benef += c.benefice; p.h += c.heuresTot;
    parMois.set(k, p);
  });
  const mois = Array.from(parMois.values()).sort((x,y) => x.k.localeCompare(y.k));
  const maxCA = Math.max(1, ...mois.map(x => x.ca));
  const pic = mois.reduce((best, x) => (!best || x.ca > best.ca) ? x : best, null);

  const bouton = (v, lib) => '<button class="segment" data-periode="' + v + '" aria-pressed="' + (Etat.periode.mode === v) + '">' + e(lib) + '</button>';
  const tuile = (lib, val, note, style) =>
    '<div class="indic ' + (style || '') + '"><span class="indic-lib">' + e(lib) + '</span>' +
    '<span class="indic-val nb">' + e(val) + '</span><span class="indic-note">' + e(note || '') + '</span></div>';

  const graphe = mois.length
    ? '<div class="graphe" id="graphe">' +
        '<div class="graphe-grille"><span style="top:0">' + e(euro(maxCA)) + '</span><span style="top:50%">' + e(euro(maxCA/2)) + '</span><span style="top:100%">0</span></div>' +
        mois.map(x => {
          const h = Math.max(2, Math.round(x.ca / maxCA * 148));
          const [an, mo] = x.k.split('-');
          const lib = MOIS_COURTS[+mo - 1] + (mois.length > 12 ? ' ’' + an.slice(2) : '');
          return '<div class="colonne ' + (x.ca === 0 ? 'zero' : '') + (pic && x.k === pic.k ? ' pic' : '') + '" data-mois="' + e(x.k) + '" title="' + e(lib + ' — ' + euro(x.ca) + ' · ' + x.n + ' mariage' + (x.n > 1 ? 's' : '')) + '">' +
            '<span class="colonne-val nb">' + e(euro(x.ca)) + '</span>' +
            '<span class="barre" style="height:' + h + 'px"></span>' +
            '<span class="colonne-lib">' + e(lib) + '</span></div>';
        }).join('') +
      '</div><p class="legende-graphe">Chiffre d’affaires par mois — ' + e(b.lib.toLowerCase()) + '. Survole une colonne pour le détail.</p>'
    : '<p style="color:var(--sourdine); font-size:13.5px">Aucun mariage sur cette période.</p>';

  $('#vue-analyse').innerHTML =
    '<div class="bloc"><div class="bloc-titre"><span>Période</span></div>' +
      '<div class="filtres">' +
        '<div class="segments">' + bouton('annee','Cette année') + bouton('precedente','Année passée') + bouton('suivante','Année à venir') +
          bouton('douze','12 derniers mois') + bouton('tout','Depuis le début') + bouton('perso','Personnalisée') + '</div>' +
        (Etat.periode.mode === 'perso'
          ? '<input class="mini" type="date" id="periode-de" value="' + e(Etat.periode.de) + '" aria-label="Date de début">' +
            '<input class="mini" type="date" id="periode-a" value="' + e(Etat.periode.a) + '" aria-label="Date de fin">'
          : '') +
      '</div>' +
      '<div class="puces" style="margin-top:4px">' +
        ORDRE_STATUTS.map(k => '<button class="puce" data-statut-periode="' + k + '" aria-pressed="' + Etat.periode.statuts.includes(k) + '">' + e(STATUTS[k].l) + '</button>').join('') +
      '</div>' +
    '</div>' +

    '<div class="indics">' +
      tuile('Mariages', String(t.n), b.lib) +
      tuile("Chiffre d'affaires", euro(t.ca), t.n ? 'Panier moyen ' + euro(t.ca / t.n) : '—', 'souligne') +
      tuile('Frais', euro(t.frais), t.depl ? 'dont ' + euro(t.depl) + ' de déplacement facturé' : 'Dépenses saisies') +
      tuile('Bénéfice', euro(t.benef), t.ca ? 'Marge ' + Math.round(t.benef / t.ca * 100) + ' %' : '—', 'souligne') +
      tuile('Heures passées', heures(t.h), t.n ? nf1.format(t.h / t.n) + ' h par mariage' : '—') +
      tuile('€ par heure', t.h ? nf0.format(Math.round(t.benef / t.h)) + ' €' : '—',
            t.h ? 'Objectif ' + euro(nb(Etat.reglages.tarifCible)) : 'Saisis des heures',
            t.h && (t.benef / t.h) < nb(Etat.reglages.tarifCible) ? 'alerte' : (t.h ? 'souligne' : '')) +
      tuile('Encaissé', euro(t.enc), t.ca ? Math.round(t.enc / Math.max(1,t.ca) * 100) + ' % du total' : '—') +
      tuile('Reste à encaisser', euro(t.reste), t.reste > 0 ? 'À relancer' : 'Tout est réglé', t.reste > 0 ? 'alerte' : 'souligne') +
    '</div>' +

    '<div class="bloc"><div class="bloc-titre"><span>Mois par mois</span>' +
      '<button class="btn btn-fin" id="export-analyse">Exporter en CSV</button></div>' + graphe + '</div>' +

    (mois.length ? '<div class="bloc"><div class="bloc-titre">Détail mensuel</div><div class="cadre-mini"><table class="mini-table">' +
      '<thead><tr><th>Mois</th><th class="num">Mariages</th><th class="num">CA</th><th class="num">Frais</th><th class="num">Bénéfice</th><th class="num">Heures</th><th class="num">€ / h</th></tr></thead><tbody>' +
      mois.map(x => {
        const [an, mo] = x.k.split('-');
        return '<tr><td>' + e(MOIS[+mo - 1] + ' ' + an) + '</td><td class="num">' + x.n + '</td>' +
          '<td class="num">' + e(euro(x.ca)) + '</td><td class="num">' + e(euro(x.frais)) + '</td>' +
          '<td class="num">' + e(euro(x.benef)) + '</td><td class="num">' + e(x.h ? heures(x.h) : '—') + '</td>' +
          '<td class="num">' + e(x.h ? nf0.format(Math.round(x.benef / x.h)) + ' €' : '—') + '</td></tr>';
      }).join('') +
      '<tr class="total"><td>Total</td><td class="num">' + t.n + '</td><td class="num">' + e(euro(t.ca)) + '</td>' +
      '<td class="num">' + e(euro(t.frais)) + '</td><td class="num">' + e(euro(t.benef)) + '</td>' +
      '<td class="num">' + e(t.h ? heures(t.h) : '—') + '</td><td class="num">' + e(t.h ? nf0.format(Math.round(t.benef / t.h)) + ' €' : '—') + '</td></tr>' +
      '</tbody></table></div></div>' : '') +

    '<div class="duo">' +
      tableRepartition('Par lieu',       repartition(liste, m => m.lieuNom), t.ca) +

    '</div>' +
    '<div class="duo">' +
      tableRepartition('Par formule',    repartition(liste, m => m.formule), t.ca) +
      tableRepartition('Par ville',      repartition(liste, m => m.lieuVille), t.ca) +
    '</div>';
}

/* =======================================================================
   À faire
   ======================================================================= */
function rendreAFaire(){
  const items = toutAFaire(), auj = aujourdhui();
  const semaine = plusJours(auj, 7), mois1 = plusJours(auj, 35);
  const groupes = [
    {t:'En retard ou urgent', f:i => i.retard, urgent:true},
    {t:'Cette semaine',       f:i => !i.retard && i.date && i.date <= semaine},
    {t:'Dans le mois',        f:i => !i.retard && i.date && i.date > semaine && i.date <= mois1},
    {t:'Plus tard',           f:i => !i.retard && i.date && i.date > mois1},
    {t:'Sans échéance',       f:i => !i.retard && !i.date}
  ];
  let html = '';
  let vide = true;
  groupes.forEach(g => {
    const lot = items.filter(g.f);
    if (!lot.length) return;
    vide = false;
    html += '<div class="groupe-titre ' + (g.urgent ? 'urgent' : '') + '">' + e(g.t) + ' <span style="font-family:var(--sans); text-transform:none; letter-spacing:0">(' + lot.length + ')</span></div>';
    html += lot.map(i => {
      const c = calc(i.m);
      const retard = i.date && i.date < auj;
      return '<div class="tache ' + (i.genre === 'alerte' ? (i.niveau === 'urgent' ? 'retard' : 'info') : (retard ? 'retard' : '')) + '">' +
        (i.genre === 'tache'
          ? '<input type="checkbox" data-fait="' + e(i.m.id) + '|' + e(i.id) + '" aria-label="Marquer comme fait">'
          : '<span style="width:17px; flex:none; text-align:center; color:var(--laiton); margin-top:1px">!</span>') +
        '<div class="tache-corps"><div class="tache-lib">' + e(i.texte) + '</div>' +
          '<div class="tache-meta"><span class="qui" data-ouvre="' + e(i.m.id) + '">' + e(couple(i.m)) + '</span>' +
          (estDate(i.m.date) ? '<span>mariage le ' + e(fmtCourt(i.m.date)) + (c.jours != null && c.jours >= 0 ? ' · J−' + c.jours : '') + '</span>' : '') +
          '</div></div>' +
        '<div class="tache-date ' + (retard ? 'retard' : '') + '">' + e(i.date ? fmtCourt(i.date) : '—') + '</div>' +
      '</div>';
    }).join('');
  });
  $('#vue-afaire').innerHTML = vide
    ? '<div class="vide"><h3>Rien ne traîne</h3><p>Aucune échéance en retard, aucune relance à faire. Les tâches se créent automatiquement dès qu’une fiche a une date.</p></div>'
    : html;
}

/* =======================================================================
   Agenda
   ======================================================================= */
function rendreAgenda(){
  const an = Etat.anneeAgenda;
  const dedans = Array.from(Etat.mariages.values()).filter(m => String(m.date||'').slice(0,4) === String(an));
  const annees = anneesDisponibles();
  if (!annees.includes(String(an))) annees.push(String(an));
  annees.sort();

  const cases = [];
  for (let i = 0; i < 12; i++){
    const duMois = dedans.filter(m => +m.date.slice(5,7) === i + 1).sort((x,y) => x.date.localeCompare(y.date));
    const ca = duMois.filter(m => COMPTE_CA.includes(m.statut)).reduce((s,m) => s + calc(m).total, 0);
    cases.push('<div class="mois ' + (duMois.length ? 'plein' : '') + '">' +
      '<h3><span>' + e(MOIS[i]) + '</span>' + (ca ? '<span class="nb">' + e(euro(ca)) + '</span>' : '') + '</h3>' +
      (duMois.length ? duMois.map(m => {
        const s = STATUTS[m.statut] || STATUTS.demande;
        const couleur = s.c === 'p-vert' ? 'var(--vert)' : s.c === 'p-laiton' ? 'var(--laiton)' : s.c === 'p-brique' ? 'var(--brique)' : s.c === 'p-ardoise' ? 'var(--ardoise)' : 'var(--trait-fort)';
        return '<div class="evt" data-ouvre="' + e(m.id) + '">' +
          '<span class="evt-j nb">' + e(String(+m.date.slice(8,10)).padStart(2,'0') + ' ' + ['di','lu','ma','me','je','ve','sa'][jourDe(m.date).getDay()]) + '</span>' +
          '<span class="evt-pt" style="background:' + couleur + '"></span>' +
          '<span class="evt-nom">' + e(couple(m)) + (m.lieuNom ? ' <span style="color:var(--sourdine)">· ' + e(m.lieuNom) + '</span>' : '') + '</span></div>';
      }).join('') : '<p style="color:var(--sourdine); font-size:13px">Libre</p>') +
    '</div>');
  }

  const caAn = dedans.filter(m => COMPTE_CA.includes(m.statut)).reduce((s,m) => s + calc(m).total, 0);
  const samedis = dedans.filter(m => jourDe(m.date).getDay() === 6).length;

  $('#vue-agenda').innerHTML =
    '<div class="bloc"><div class="bloc-titre">' +
      '<span>Année</span>' +
      '<div class="segments">' + annees.map(a => '<button class="segment" data-annee-agenda="' + a + '" aria-pressed="' + (String(an) === a) + '">' + a + '</button>').join('') + '</div>' +
      '<span style="text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:13px">' +
        e(dedans.length + ' mariage' + (dedans.length > 1 ? 's' : '') + ' · ' + euro(caAn) + (samedis ? ' · ' + samedis + ' samedi' + (samedis > 1 ? 's' : '') : '')) + '</span>' +
      '<button class="btn btn-fin" id="gcal-annee">Tout envoyer vers Google Agenda</button>' +
    '</div>' +
    '<div id="gcal-retour" class="resultat-mcp"></div></div>' +
    '<div class="mois-grille">' + cases.join('') + '</div>';
}

function rendreFiche(){

  const ch = (cle, lib, type, opts) => {
    opts = opts || {};
    const v = m[cle] == null ? '' : m[cle];

/* ---------- texte récapitulatif ---------- */
function ficheEnTexte(m){
  const c = calc(m);
  const l = [];
  l.push(couple(m).toUpperCase());
  l.push('Statut : ' + ((STATUTS[m.statut]||{}).l || ''));
  if (estDate(m.date)) l.push('Date : ' + capi(fmtLong(m.date)));
  if (m.mairieHeure) l.push('Mairie : ' + m.mairieHeure);
  if (m.ceremonieHeure) l.push('Cérémonie : ' + m.ceremonieHeure + (m.ceremonieLieu ? ' — ' + m.ceremonieLieu : ''));
  if (m.heureDebut || m.heureFin) l.push('Prestation : ' + (m.heureDebut||'?') + ' → ' + (m.heureFin||'?'));
  if (m.lieuNom) l.push('Lieu : ' + [m.lieuNom, m.lieuAdresse, [m.lieuCp, m.lieuVille].filter(Boolean).join(' ')].filter(Boolean).join(', '));
  if (m.lieuTel || m.lieuContact) l.push('Contact lieu : ' + [m.lieuContact, m.lieuTel].filter(Boolean).join(' — '));
  if (m.invites) l.push('Invités : ' + m.invites);
  if (m.tel || m.email) l.push('Contact : ' + [m.tel, m.email].filter(Boolean).join(' — '));
  if (m.adresse) l.push('Adresse : ' + m.adresse);
  if ((m.prestations||[]).length) l.push('Prestations : ' + m.prestations.join(', '));
  l.push('Total : ' + euro(c.total) + ' · encaissé ' + euro(c.encaisse) + ' · reste ' + euro(c.reste));
  if (c.heuresTot) l.push('Temps prévu : ' + heures(c.heuresTot));
  if (m.notes) l.push('', 'Notes : ' + m.notes);
  return l.join('\n');
}

  const c = (err && err.code) || 'upstream_error';
  if (c === 'needs_reauth')        return 'Reconnecte ' + serveur + ' dans claude.ai → Paramètres → Connecteurs.';
  if (c === 'server_not_connected')return 'Ajoute ' + serveur + ' dans claude.ai → Paramètres → Connecteurs.';
  if (c === 'selection_required')  return 'Tu as plusieurs comptes ' + serveur + '. Choisis-en un quand Claude te le demande, puis réessaie.';
  if (c === 'server_not_found')    return serveur + ' n’existe plus côté Google.';
  if (c === 'not_in_manifest')     return 'Cette page n’a pas l’autorisation d’utiliser ' + serveur + '.';
  if (c === 'blocked_by_policy')   return 'La politique de ton organisation bloque ' + serveur + ' ici.';
  if (c === 'approval_required')   return 'Cet appel demande une validation manuelle, impossible depuis une page.';
  if (c === 'server_unavailable')  return serveur + ' ne répond pas. Réessaie dans un instant.';
  if (c === 'tool_error')          return 'Google a refusé : ' + ((err && err.message) || 'raison non précisée');
  if (c === 'bad_request' || c === 'transform_error') return 'Requête mal formée — signale-le.';
  if (c === 'cancelled')           return 'Appel annulé.';
  if (c === 'rate_limited')        return 'Trop d’appels d’un coup. Attends quelques secondes.';
  if (c === 'consent_required')    return 'Autorise ' + serveur + ' pour cette page, puis réessaie.';
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed')
    return 'Les connecteurs ne sont pas disponibles dans cette vue.';
  return serveur + ' est injoignable pour l’instant.';
}

function fouiller(objet, test, prof){
  const trouves = [];
  const vus = new Set();
  (function visite(o, p){
    if (!o || p > 6 || trouves.length > 60) return;
    if (Array.isArray(o)) return o.forEach(x => visite(x, p + 1));
    if (typeof o !== 'object') return;
    if (vus.has(o)) return;
    vus.add(o);
    if (test(o)) trouves.push(o);
    Object.keys(o).forEach(k => visite(o[k], p + 1));
  })(objet, 0);
  return trouves;
}
function trouverLienAgenda(p){
  let lien = '';
  fouiller(p, o => {
    Object.keys(o).forEach(k => {
      const v = o[k];
      if (!lien && typeof v === 'string' && /^https:\/\/(www\.google\.com\/calendar|calendar\.google\.com)\//.test(v)) lien = v;
    });
    return false;
  });
  return lien;
}

async function telecharger(nom, contenu, mime){
  const d = await telechNs();
  if (d){
    try { await d.save({filename:nom, data:contenu}); annonce('Fichier prêt : ' + nom); return; }
    catch(err){
      const c = err && err.code;
      if (c === 'declined' || c === 'rate_limited') return;
      if (c === 'rejected_extension' || c === 'extension_not_enabled' || c === 'unavailable'){ ouvrirTexte(nom, contenu); return; }
      if (c === 'too_large'){ annonce('Fichier trop lourd pour être enregistré ici.'); return; }
      ouvrirTexte(nom, contenu); return;
    }
  }
  if (window.claude && window.claude.use){ ouvrirTexte(nom, contenu); return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + contenu], {type: mime || 'text/plain;charset=utf-8'}));
    a.download = nom;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch(_){ ouvrirTexte(nom, contenu); }
}

function trouverLien(objet, re){
  let lien = '';
  fouiller(objet, o => {
    Object.keys(o).forEach(k => {
      const v = o[k];
      if (!lien && typeof v === 'string' && re.test(v)) lien = v;
    });
    return false;
  });
  return lien;
}

async function brouillon(m, type){
  const zone = $('#retour-mcp'); if (!zone) return;
  const mcp = await mcpNs();
  if (!mcp){ zone.textContent = 'Gmail n’est pas disponible dans cette vue (ouvre la page publiée sur claude.ai).'; return; }
  const entree = {subject: SUJETS[type](m), body: remplirModele(Etat.reglages.modeles[type], m)};
  if (m.email) entree.to = [m.email];
  zone.textContent = 'Création du brouillon dans Gmail…';
  try {
    const res = await mcp.callTool(GMAIL, 'create_draft', entree);
    const lien = trouverLien(res && res.payload, /^https:\/\/mail\.google\.com\//) || trouverLien(res, /^https:\/\/mail\.google\.com\//);
    zone.innerHTML = 'Brouillon « ' + e(type) + ' » créé' + (m.email ? ' pour ' + e(m.email) : ' (sans destinataire : ajoute l’e-mail)') + '.' +
      (lien ? ' <a href="' + e(lien) + '" target="_blank" rel="noopener">L’ouvrir dans Gmail</a>' : '');
    if (type === 'devis'){
      let bouge = false;
      if (!m.devisLe){ m.devisLe = aujourdhui(); bouge = true; }
      if (m.statut === 'demande'){ m.statut = 'devis'; bouge = true; }
      if (bouge){ enregistrer(m.id, true); rendreFiche(); rendreTout(); }
    }
  } catch(err){ zone.textContent = msgMcp(err, GMAIL); }
}

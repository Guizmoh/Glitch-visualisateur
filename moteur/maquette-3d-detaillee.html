{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<script type="module">
/* =========================================================================
   maquette-3d-detaillee.html — JUSQU'OU PEUT-ON POUSSER LE RENDU ?
   Meme carte que le jeu 2D, mais avec les techniques qui donnent aux jeux
   modernes leur cachet :
     - un TERRAIN sculpte par du bruit (fBm), pas un plan plat
     - de l'HERBE en dizaines de milliers de brins, agitee par le vent
     - un CIEL calcule par un shader (degrade, halo solaire, nuages)
     - un eclairage d'heure doree, des ombres douces, du brouillard aerien
     - un ombrage CEL (a bandes) + lumiere de contour sur les personnages
     - une exposition cinema (tone mapping ACES)
   Tout est genere par le code : aucune texture, aucun modele 3D telecharge.
   ========================================================================= */

import * as THREE from 'three';
import { CARTES } from './src/contenu/cartes.js';
import { TUILES } from './src/contenu/tuiles.js';
import { Atlas, creerCanvas } from './src/noyau/pixels.js';
import { SPRITES, PALETTE } from './src/contenu/sprites.js';

/* ===================================================================== */
/* 1. BRUIT — la base de tout paysage genere                             */
/* ===================================================================== */

function alea(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

function bruitDouux(x, y) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = alea(xi, yi);
  const b = alea(xi + 1, yi);
  const c = alea(xi, yi + 1);
  const d = alea(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}

/** Bruit "en crete" : au lieu de bosses rondes, il produit des aretes vives.
    C'est lui qui donne les falaises plutot que des collines en coussin. */
function bruitCrete(x, y, octaves = 4) {
  let valeur = 0;
  let amplitude = 0.5;
  let frequence = 1;
  for (let i = 0; i < octaves; i++) {
    const n = 1 - Math.abs(bruitDouux(x * frequence, y * frequence) * 2 - 1);
    valeur += n * n * amplitude;
    amplitude *= 0.5;
    frequence *= 2.1;
  }
  return valeur;
}

/** fBm : on empile plusieurs bruits de plus en plus fins. */
function fbm(x, y, octaves = 5) {
  let valeur = 0;
  let amplitude = 0.5;
  let frequence = 1;
  for (let i = 0; i < octaves; i++) {
    valeur += bruitDouux(x * frequence, y * frequence) * amplitude;
    amplitude *= 0.5;
    frequence *= 2;
  }
  return valeur;
}

/* ===================================================================== */
/* 2. LE TERRAIN                                                         */
/* ===================================================================== */

const SALLE = CARTES.village;
const GRILLE = SALLE.decor.map((l) => l.split(''));
const LARGEUR = GRILLE[0].length;
const PROFONDEUR = GRILLE.length;
const CASE = 2.4;
const CENTRE = new THREE.Vector2((LARGEUR * CASE) / 2, (PROFONDEUR * CASE) / 2);
const RAYON_VILLAGE = 30;
const TAILLE_MONDE = 320;

/** Hauteur du sol en tout point. Le village, lui, reste bien plat. */
function hauteurTerrain(x, z) {
  const collines = (fbm(x * 0.008, z * 0.008, 5) - 0.5) * 44;
  // Les cretes ne sortent que sur les hauteurs : plaine douce en bas,
  // reliefs casses en haut.
  const force = THREE.MathUtils.smoothstep(collines, 2, 16);
  const cretes = bruitCrete(x * 0.016, z * 0.016, 4) * 26 * force;
  // Des "mesas" a moyenne echelle : c'est elles qui, une fois terrassees,
  // deviennent des plateaux a parois verticales.
  const mesas = (fbm(x * 0.03 + 5.5, z * 0.03 + 2.2, 3) - 0.5) * 20;
  const relief = (fbm(x * 0.08, z * 0.08, 3) - 0.5) * 1.8;
  let h = collines + cretes + mesas + relief;

  // Terrassement : on "escalier-ise" le relief. Les paliers deviennent des
  // plateaux, et le saut entre deux paliers devient une falaise.
  const pas = 5.0;
  const marches = Math.floor(h / pas) * pas + pas * 0.5;
  const force2 = THREE.MathUtils.smoothstep(Math.abs(h), 2, 9);
  h = THREE.MathUtils.lerp(h, marches, 0.88 * force2);
  // Aplatissement progressif autour du village.
  const d = Math.hypot(x - CENTRE.x, z - CENTRE.y);
  const melange = THREE.MathUtils.smoothstep(d, RAYON_VILLAGE * 0.45, RAYON_VILLAGE * 1.5);
  h *= 0.1 + 0.9 * melange; // le village reste jouable, sans etre une crepe
  // Bosses fines partout : c'est ce qui empeche le sol de paraitre lisse.
  h += (fbm(x * 0.12, z * 0.12, 2) - 0.5) * 0.55;
  return h;
}

function normaleTerrain(x, z, pas = 0.6) {
  const hx = hauteurTerrain(x + pas, z) - hauteurTerrain(x - pas, z);
  const hz = hauteurTerrain(x, z + pas) - hauteurTerrain(x, z - pas);
  return new THREE.Vector3(-hx, 2 * pas, -hz).normalize();
}

/* ===================================================================== */
/* 3. SCENE, CAMERA, RENDU                                               */
/* ===================================================================== */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.25, 900);

const rendu = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
rendu.setSize(innerWidth, innerHeight);
rendu.setPixelRatio(Math.min(devicePixelRatio, 1.75));
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = THREE.PCFSoftShadowMap;
// Exposition facon cinema : c'est ce qui donne les belles hautes lumieres.
rendu.toneMapping = THREE.ACESFilmicToneMapping;
rendu.toneMappingExposure = 1.0;
rendu.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(rendu.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  rendu.setSize(innerWidth, innerHeight);
});

/* --- Heure doree : le soleil est bas et chaud ------------------------ */
const DIRECTION_SOLEIL = new THREE.Vector3(0.55, 0.24, -0.78).normalize();
const COULEUR_SOLEIL = new THREE.Color(0xffd9a0);
const COULEUR_HORIZON = new THREE.Color(0xf6d9b4);
const COULEUR_BRUME = new THREE.Color(0xc7d9e8);

// La couleur doit etre CELLE DE L'HORIZON DU CIEL, sinon on voit une
// couture nette la ou le terrain s'arrete.
scene.fog = new THREE.FogExp2(0xe6d2b4, 0.0046);

const soleil = new THREE.DirectionalLight(COULEUR_SOLEIL, 2.35);
soleil.position.copy(DIRECTION_SOLEIL).multiplyScalar(90);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
soleil.shadow.bias = -0.0009;
soleil.shadow.normalBias = 0.05;
const boite = soleil.shadow.camera;
boite.left = -34; boite.right = 34; boite.top = 34; boite.bottom = -34;
boite.near = 1; boite.far = 220;
boite.updateProjectionMatrix();
scene.add(soleil, soleil.target);

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x516b40, 0.95));
const appoint = new THREE.DirectionalLight(0x9ec8ff, 0.35); // lumiere du ciel, en contre
appoint.position.set(-40, 30, 50);
scene.add(appoint);

/* ===================================================================== */
/* 4. LE CIEL (shader maison)                                            */
/* ===================================================================== */

const ciel = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      soleil: { value: DIRECTION_SOLEIL },
      temps: { value: 0 },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 soleil;
      uniform float temps;
      varying vec3 vDir;

      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float bruit(vec2 p){
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1,0)), u.x),
                   mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
      }
      float fbm(vec2 p){
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 5; i++) { v += bruit(p) * a; p *= 2.02; a *= 0.5; }
        return v;
      }

      void main() {
        vec3 d = normalize(vDir);
        float h = max(d.y, 0.0);

        // Degrade : brume chaude en bas, bleu profond au zenith.
        vec3 zenith  = vec3(0.16, 0.38, 0.72);
        vec3 horizon = vec3(0.92, 0.82, 0.70);
        vec3 couleur = mix(horizon, zenith, pow(h, 0.42));

        // Halo puis disque solaire.
        float s = max(dot(d, normalize(soleil)), 0.0);
        couleur += vec3(1.0, 0.62, 0.30) * pow(s, 6.0) * 0.55;
        couleur += vec3(1.0, 0.86, 0.62) * pow(s, 160.0) * 2.2;
        couleur += vec3(1.0, 0.95, 0.85) * smoothstep(0.9995, 0.9999, s) * 8.0;

        // Nuages : du fBm projete sur le dome, qui derive lentement.
        if (d.y > 0.02) {
          vec2 uv = d.xz / (d.y + 0.28) * 0.9 + vec2(temps * 0.004, temps * 0.002);
          float n = fbm(uv * 1.4);
          float nuage = smoothstep(0.52, 0.86, n) * smoothstep(0.02, 0.22, d.y);
          vec3 tonNuage = mix(vec3(0.62, 0.60, 0.66), vec3(1.0, 0.94, 0.86), pow(s, 2.0) * 0.8 + 0.35);
          couleur = mix(couleur, tonNuage, nuage * 0.82);
        }
        gl_FragColor = vec4(couleur, 1.0);
      }`,
  })
);
ciel.frustumCulled = false;
scene.add(ciel);

/* ===================================================================== */
/* 5. MATIERES : ombrage cel + lumiere de contour                        */
/* ===================================================================== */

/**
 * LA RAMPE DE TONS. C'est le coeur du cel shading : au lieu d'un degrade
 * continu, la lumiere ne peut prendre que ces quelques valeurs. On la donne
 * a three.js sous forme d'une minuscule image de 4 pixels, lue au plus
 * proche voisin (donc sans aucun adoucissement).
 */
const degradeToon = new THREE.DataTexture(
  new Uint8Array([44, 104, 188, 255]), 4, 1, THREE.RedFormat
);
degradeToon.minFilter = THREE.NearestFilter;
degradeToon.magFilter = THREE.NearestFilter;
degradeToon.needsUpdate = true;

/** Matiere d'encre pour les contours (voir ajouterContour plus bas). */
function matiereContour(epaisseur, couleur = 0x191823) {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide,   // on ne voit que l'interieur de la coque gonflee
    fog: true,
    uniforms: THREE.UniformsUtils.merge([
      THREE.UniformsLib.fog,
      { epaisseur: { value: epaisseur }, encre: { value: new THREE.Color(couleur) } },
    ]),
    vertexShader: `
      uniform float epaisseur;
      #include <common>
      #include <fog_pars_vertex>
      void main() {
        #include <beginnormal_vertex>
        #include <begin_vertex>
        transformed += objectNormal * epaisseur;  // on gonfle le long des normales
        #include <project_vertex>
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform vec3 encre;
      #include <common>
      #include <fog_pars_fragment>
      void main() {
        gl_FragColor = vec4(encre, 1.0);
        #include <fog_fragment>
      }`,
  });
}

/**
 * CONTOUR A L'ENCRE, methode de la "coque inversee" : on redessine l'objet
 * une deuxieme fois, legerement gonfle, en noir, et en ne gardant que ses
 * faces arriere. Il depasse tout autour : c'est le trait.
 */
function ajouterContour(maille, epaisseur = 0.05) {
  const materiau = matiereContour(epaisseur);
  let contour;
  if (maille.isInstancedMesh) {
    contour = new THREE.InstancedMesh(maille.geometry, materiau, maille.count);
    contour.instanceMatrix = maille.instanceMatrix; // on partage les positions
  } else {
    contour = new THREE.Mesh(maille.geometry, materiau);
  }
  contour.frustumCulled = maille.frustumCulled;
  contour.castShadow = false;
  contour.receiveShadow = false;
  contour.renderOrder = -1;
  maille.add(contour); // enfant : il suit l'objet automatiquement
  return maille;
}

/** Applique un contour a toutes les mailles d'un groupe (un personnage). */
function contournerGroupe(groupe, epaisseur = 0.028) {
  const mailles = [];
  groupe.traverse((o) => { if (o.isMesh) mailles.push(o); });
  for (const m of mailles) ajouterContour(m, epaisseur);
  return groupe;
}

/**
 * Ombrage cel : MeshToonMaterial de three.js (qui apporte gratuitement les
 * ombres portees, le brouillard et les lumieres) + la rampe de tons ci-dessus
 * + une lumiere de contour greffee dans le shader.
 */
function matiereCel(couleur, options = {}) {
  const { contour = 0.5 } = options;
  const materiau = new THREE.MeshToonMaterial({
    color: couleur,
    gradientMap: degradeToon,
  });
  materiau.onBeforeCompile = (shader) => {
    shader.uniforms.forceRim = { value: contour * 0.42 };
    shader.uniforms.couleurRim = { value: new THREE.Color(0xfff0d8) };
    shader.fragmentShader = `
      uniform float forceRim;
      uniform vec3 couleurRim;
      ${shader.fragmentShader}`
      .replace('#include <fog_fragment>', `
        // Lumiere de contour : les bords qui s'eloignent de la camera
        // recoivent un liseré clair. C'est ce qui detache du decor.
        float bordure = pow(1.0 - clamp(dot(normalize(vNormal), normalize(vViewPosition)), 0.0, 1.0), 3.5);
        gl_FragColor.rgb += couleurRim * bordure * forceRim;
        #include <fog_fragment>`);
  };
  return materiau;
}

/* ===================================================================== */
/* 6. LES TEXTURES DU SOL (fabriquees pixel par pixel)                   */
/* ===================================================================== */

/** Bruit qui se raccorde parfaitement d'un bord a l'autre : la texture
    peut donc etre repetee a l'infini sans coupure visible. */
function bruitPeriodique(x, y, periode) {
  const enroule = (v) => ((v % periode) + periode) % periode;
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = alea(enroule(xi), enroule(yi));
  const b = alea(enroule(xi + 1), enroule(yi));
  const c = alea(enroule(xi), enroule(yi + 1));
  const d = alea(enroule(xi + 1), enroule(yi + 1));
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}

function fbmPeriodique(x, y, octaves = 4, periodeDepart = 4) {
  let valeur = 0;
  let amplitude = 0.5;
  let periode = periodeDepart;
  for (let i = 0; i < octaves; i++) {
    valeur += bruitPeriodique(x * periode, y * periode, periode) * amplitude;
    amplitude *= 0.5;
    periode *= 2;
  }
  return valeur;
}

const TAILLE_TEXTURE = 256;

function textureProcedurale(calculer) {
  const { canvas, ctx } = creerCanvas(TAILLE_TEXTURE, TAILLE_TEXTURE);
  const image = ctx.createImageData(TAILLE_TEXTURE, TAILLE_TEXTURE);
  for (let y = 0; y < TAILLE_TEXTURE; y++) {
    for (let x = 0; x < TAILLE_TEXTURE; x++) {
      const [r, v, b] = calculer(x / TAILLE_TEXTURE, y / TAILLE_TEXTURE);
      const i = (y * TAILLE_TEXTURE + x) * 4;
      image.data[i] = r; image.data[i + 1] = v; image.data[i + 2] = b; image.data[i + 3] = 255;
    }
  }
  ctx.putImageData(image, 0, 0);
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = rendu.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Herbe : un fond vert module, plus de fines stries dans un sens.
const texHerbe = textureProcedurale((u, v) => {
  const touffes = fbmPeriodique(u, v, 4, 5);
  const brins = bruitPeriodique(u * 40, v * 40, 40) * 0.7
              + bruitPeriodique(u * 70, v * 14, 70) * 0.3;
  const sec = Math.pow(fbmPeriodique(u + 3.1, v + 7.7, 3, 3), 2);
  const melange = touffes * 0.65 + brins * 0.35;
  const r = 48 + melange * 92 + sec * 74;
  const g = 84 + melange * 108 - sec * 6;
  const b = 32 + melange * 48 + sec * 18;
  return [r, g, b];
});

// Terre : brun, avec des cailloux clairs semes dedans.
const texTerre = textureProcedurale((u, v) => {
  const grain = fbmPeriodique(u, v, 5, 6);
  const cailloux = bruitPeriodique(u * 40, v * 40, 40);
  const pierre = cailloux > 0.86 ? (cailloux - 0.86) * 5 : 0;
  const r = 104 + grain * 64 + pierre * 90;
  const g = 80 + grain * 52 + pierre * 88;
  const b = 54 + grain * 34 + pierre * 84;
  return [r, g, b];
});

// Roche : gris froid, strie horizontalement comme un affleurement.
const texRoche = textureProcedurale((u, v) => {
  // Des bandes horizontales (comme des couches geologiques) plutot que du
  // bruit isotrope : c'est ce qui fait "lire" une paroi rocheuse.
  const strates = fbmPeriodique(u * 0.5, v * 3.2, 4, 4);
  const grain = fbmPeriodique(u * 2.0, v * 2.0, 3, 8);
  // Joints reguliers entre les couches.
  const position = ((v * 5) % 1 + 1) % 1;
  const joint = Math.min(position, 1 - position) < 0.045 ? 0.62 : 1;
  const base = (86 + strates * 82 + grain * 26) * joint;
  return [base * 1.06, base * 1.0, base * 0.9];
});

/* ===================================================================== */
/* 7. LE SOL                                                             */
/* ===================================================================== */

const SEGMENTS = 190;
const geoTerrain = new THREE.PlaneGeometry(TAILLE_MONDE, TAILLE_MONDE, SEGMENTS, SEGMENTS);
geoTerrain.rotateX(-Math.PI / 2);
{
  const pos = geoTerrain.attributes.position;
  const couleurs = [];
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + CENTRE.x;
    const z = pos.getZ(i) + CENTRE.y;
    const h = hauteurTerrain(x, z);
    pos.setXYZ(i, pos.getX(i), h, pos.getZ(i));
    // La couleur des sommets nuance de grandes zones ; le detail vient des
    // textures. Sans ca, tout le paysage serait du meme vert.
    const variation = fbm(x * 0.05, z * 0.05, 3);
    const zones = fbm(x * 0.013 + 11.3, z * 0.013 + 4.7, 3);
    const altitude = THREE.MathUtils.clamp(h / 22, -1, 1);
    const luminosite = 0.78 + variation * 0.34 + altitude * 0.14;
    c.setRGB(luminosite, luminosite, luminosite);
    // Plaques d'herbe seche, et hauteurs qui tirent vers le froid.
    c.lerp(new THREE.Color(0xd8c070), THREE.MathUtils.smoothstep(zones, 0.54, 0.8) * 0.7);
    c.lerp(new THREE.Color(0x93a6ba), THREE.MathUtils.smoothstep(h, 16, 34) * 0.55);
    // Les parois raides virent au mineral chaud.
    const pente = 1 - normaleTerrain(x, z).y;
    c.lerp(new THREE.Color(0xb49a7c), THREE.MathUtils.smoothstep(pente, 0.2, 0.5) * 0.85);
    couleurs.push(c.r, c.g, c.b);
  }
  geoTerrain.setAttribute('color', new THREE.Float32BufferAttribute(couleurs, 3));
  geoTerrain.computeVertexNormals();
}
/**
 * Le materiau du sol. On part d'un materiau standard de three.js (pour
 * garder gratuitement les ombres, le brouillard et les lumieres), et on
 * greffe dedans notre melange de textures : herbe a plat, roche sur les
 * pentes, terre par plaques. Chaque texture est plaquee DEUX FOIS, a deux
 * echelles differentes : c'est l'astuce qui casse l'effet "papier peint".
 */
const matiereSol = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: degradeToon });
matiereSol.onBeforeCompile = (shader) => {
  shader.uniforms.texHerbe = { value: texHerbe };
  shader.uniforms.texTerre = { value: texTerre };
  shader.uniforms.texRoche = { value: texRoche };

  shader.vertexShader = `varying vec3 vMonde;\nvarying vec3 vNormaleMonde;\n${shader.vertexShader}`
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vMonde = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vNormaleMonde = normalize(mat3(modelMatrix) * normal);`);

  shader.fragmentShader = `
    uniform sampler2D texHerbe;
    uniform sampler2D texTerre;
    uniform sampler2D texRoche;
    varying vec3 vMonde;
    varying vec3 vNormaleMonde;
    ${shader.fragmentShader}`
    .replace('#include <color_fragment>', `#include <color_fragment>
      vec2 uvLarge = vMonde.xz * 0.028;
      vec2 uvFine  = vMonde.xz * 0.19;
      vec3 herbe = mix(texture2D(texHerbe, uvLarge).rgb, texture2D(texHerbe, uvFine).rgb, 0.5);
      vec3 terre = mix(texture2D(texTerre, uvLarge).rgb, texture2D(texTerre, uvFine).rgb, 0.5);

      // PROJECTION TRIPLANAIRE pour la roche : on plaque la texture selon les
      // trois axes et on melange d'apres la normale. Sans ca, la texture est
      // etiree verticalement sur les falaises (le defaut classique).
      vec3 n = abs(normalize(vNormaleMonde));
      vec3 poids = n / max(n.x + n.y + n.z, 0.0001);
      float k = 0.075;
      vec3 rocheX = texture2D(texRoche, vMonde.zy * k).rgb;
      vec3 rocheY = texture2D(texRoche, vMonde.xz * k).rgb;
      vec3 rocheZ = texture2D(texRoche, vMonde.xy * k).rgb;
      vec3 roche = rocheX * poids.x + rocheY * poids.y + rocheZ * poids.z;

      float pente = 1.0 - clamp(vNormaleMonde.y, 0.0, 1.0);
      float masqueRoche = smoothstep(0.13, 0.34, pente);
      float plaques = texture2D(texTerre, vMonde.xz * 0.0055).r;
      float masqueTerre = smoothstep(0.52, 0.78, plaques) * (1.0 - masqueRoche);

      vec3 sol = mix(herbe, terre, masqueTerre * 0.85);
      sol = mix(sol, roche, masqueRoche);
      diffuseColor.rgb *= sol * 1.35;`);
};

const terrain = new THREE.Mesh(geoTerrain, matiereSol);
terrain.position.set(CENTRE.x, 0, CENTRE.y);

/* 8. L'HERBE — 34 000 brins agites par le vent                          */
/* ===================================================================== */

const NB_BRINS = 56000;
const RAYON_HERBE = 48;

const brin = new THREE.BufferGeometry();
// Un brin = un losange etroit : 4 sommets, 2 triangles.
brin.setAttribute('position', new THREE.Float32BufferAttribute([
  -0.032, 0, 0, 0.032, 0, 0, -0.014, 0.46, 0, 0.014, 0.46, 0,
], 3));
brin.setIndex([0, 1, 2, 2, 1, 3]);

const geoHerbe = new THREE.InstancedBufferGeometry();
geoHerbe.index = brin.index;
geoHerbe.attributes.position = brin.attributes.position;
{
  const decalages = new Float32Array(NB_BRINS * 3);
  const variations = new Float32Array(NB_BRINS * 3);
  let n = 0;
  for (let i = 0; i < NB_BRINS; i++) {
    // Disque autour du village, densite plus forte au centre.
    const angle = Math.random() * Math.PI * 2;
    const rayon = Math.pow(Math.random(), 0.72) * RAYON_HERBE; // dense au centre
    const x = CENTRE.x + Math.cos(angle) * rayon;
    const z = CENTRE.y + Math.sin(angle) * rayon;
    // Pas d'herbe sur les pentes trop raides ni sur les chemins.
    const col = Math.floor(x / CASE);
    const ligne = Math.floor(z / CASE);
    const lettre = (GRILLE[ligne] && GRILLE[ligne][col]) || null;
    if (lettre === ':' || lettre === 'T') continue;
    if (normaleTerrain(x, z).y < 0.82) continue; // rien sur les falaises
    decalages[n * 3] = x;
    decalages[n * 3 + 1] = hauteurTerrain(x, z);
    decalages[n * 3 + 2] = z;
    variations[n * 3] = Math.random();
    variations[n * 3 + 1] = Math.random() * Math.PI;
    // Les brins raccourcissent vers le bord : sinon on voit un disque d'herbe.
    variations[n * 3 + 2] = 1 - THREE.MathUtils.smoothstep(rayon, RAYON_HERBE * 0.7, RAYON_HERBE);
    n++;
  }
  geoHerbe.instanceCount = n;
  geoHerbe.setAttribute('decalage', new THREE.InstancedBufferAttribute(decalages.slice(0, n * 3), 3));
  geoHerbe.setAttribute('variation', new THREE.InstancedBufferAttribute(variations.slice(0, n * 3), 3));
}

const matiereHerbe = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  fog: true,
  uniforms: THREE.UniformsUtils.merge([
    THREE.UniformsLib.fog,
    {
      temps: { value: 0 },
      soleil: { value: DIRECTION_SOLEIL },
      basHerbe: { value: new THREE.Color(0x3d6b28) },
      hautHerbe: { value: new THREE.Color(0x93c750) },
      couleurSoleil: { value: COULEUR_SOLEIL },
    },
  ]),
  vertexShader: `
    attribute vec3 decalage;
    attribute vec3 variation;
    uniform float temps;
    varying float vHaut;
    varying float vLumiere;
    #include <fog_pars_vertex>
    void main() {
      vec3 p = position;
      float haut = p.y / 0.46;
      vHaut = haut;

      // Chaque brin a sa taille et son orientation.
      float echelle = (0.65 + variation.x * 0.85) * (0.15 + 0.85 * variation.z);
      float angle = variation.y * 2.0;
      float ca = cos(angle), sa = sin(angle);
      p.xz = vec2(p.x * ca - p.z * sa, p.x * sa + p.z * ca);
      p *= echelle;

      // Le vent : deux ondes qui traversent la plaine.
      float onde = sin(temps * 1.5 + decalage.x * 0.16 + decalage.z * 0.11)
                 + sin(temps * 2.7 + decalage.z * 0.3) * 0.4;
      float pliage = haut * haut * (0.42 + variation.x * 0.3);
      p.x += onde * pliage;
      p.z += onde * pliage * 0.5;

      vec3 monde = p + decalage;
      // Un brin pris de face capte plus de lumiere.
      // Legere variation d'un brin a l'autre, mais aucun ne doit etre noir.
      vLumiere = 0.78 + 0.22 * abs(sin(angle * 1.7));

      // Le morceau <fog_vertex> de three.js attend une variable qui
      // s'appelle exactement "mvPosition" : c'est pour ca qu'on la nomme ainsi.
      vec4 mvPosition = modelViewMatrix * vec4(monde, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: `
    uniform vec3 basHerbe, hautHerbe, couleurSoleil;
    varying float vHaut;
    varying float vLumiere;
    #include <fog_pars_fragment>
    void main() {
      vec3 couleur = mix(basHerbe, hautHerbe, vHaut * vHaut);
      couleur *= (0.72 + 0.28 * vLumiere) * mix(vec3(1.0), couleurSoleil, 0.5);
      gl_FragColor = vec4(couleur, 1.0);
      #include <fog_fragment>
    }`,
});
// Un truc de metier : sans ca, three.js retire l'herbe de l'ecran des que
// le centre de l'objet sort du champ.
const herbe = new THREE.Mesh(geoHerbe, matiereHerbe);
herbe.frustumCulled = false;
scene.add(herbe);

function instancier(geometrie, matiere, placements, ombre = true, contour = 0) {
  const maille = new THREE.InstancedMesh(geometrie, matiere, placements.length);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const s = new THREE.Vector3();
  placements.forEach((p, i) => {
    e.set(0, p.rotation || 0, 0);
    q.setFromEuler(e);
    s.setScalar(p.echelle || 1);
    m.compose(new THREE.Vector3(p.x, p.y, p.z), q, s);
    maille.setMatrixAt(i, m);
  });
  maille.castShadow = ombre;
  maille.receiveShadow = true;
  maille.frustumCulled = false;
  scene.add(maille);
  if (contour > 0) ajouterContour(maille, contour);
  return maille;
}

  jambeG.position.set(-0.12, 0.3, 0);

  const jambeD = jambeG.clone();

  const corps = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.37, 0.66, 10), matTunique);

  brasG.position.set(-0.32, 0.84, 0);

  const matOeil = new THREE.MeshBasicMaterial({ color: 0x1b2036 });
  g.add(jambeG, jambeD, corps, ceinture, brasG, brasD, chevelure, tete);
  for (const cote of [-1, 1]) {

}

  if (e.type !== 'pnj') continue;

  const pnj = personnage({
    tunique: estSage ? 0x7b4fc4 : 0x4a8fd9,
    cheveux: estSage ? 0xe9e6de : 0x8b5a3c,
    taille: estSage ? 1.06 : 0.96,
  });
  const x = e.x * CASE + CASE / 2;
  const z = e.y * CASE + CASE / 2;
  pnj.position.set(x, hauteurTerrain(x, z), z);
  pnj.rotation.y = Math.PI * 0.85;
  scene.add(pnj);
}

/* Le coffre */
{
  const d = SALLE.entites.find((e) => e.type === 'coffre');
  const x = d.x * CASE + CASE / 2;
  const z = d.y * CASE + CASE / 2;
  const coffre = new THREE.Group();

  caisse.position.y = 0.36;

  const couvercle = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 1.2, 10, 1, false, 0, Math.PI), matiereCel(0x8f6540, { contour: 0.5 }));
  couvercle.rotation.z = Math.PI / 2;
  couvercle.position.y = 0.72;
  couvercle.castShadow = true;

for (const [nom, motif] of Object.entries(SPRITES)) atlas.ajouterMotif(nom, motif);

/* ===================================================================== */
/* 14. DEPLACEMENT ET CAMERA                                             */
/* ===================================================================== */

const touches = new Set();
addEventListener('keydown', (e) => touches.add(e.code));
addEventListener('keyup', (e) => touches.delete(e.code));

let angleCamera = 0.4;
let distanceCamera = 9;
let hauteurCamera = 4.2;

const horloge = new THREE.Clock();
const positionCamera = new THREE.Vector3();

function animer() {
  requestAnimationFrame(animer);
  const dt = Math.min(horloge.getDelta(), 0.05);
  const t = horloge.getElapsedTime();

  ciel.material.uniforms.temps.value = t;
  matiereHerbe.uniforms.temps.value = t;
  lac.material.uniforms.temps.value = t;

  if (touches.has('KeyA')) angleCamera -= dt * 1.2;
  if (touches.has('KeyE')) angleCamera += dt * 1.2;
  if (touches.has('KeyR')) hauteurCamera = Math.min(14, hauteurCamera + dt * 6);
  if (touches.has('KeyF')) hauteurCamera = Math.max(1.4, hauteurCamera - dt * 6);

  let avant = 0;
  let cote = 0;
  if (touches.has('ArrowUp') || touches.has('KeyW') || touches.has('KeyZ')) avant += 1;
  if (touches.has('ArrowDown') || touches.has('KeyS')) avant -= 1;
  if (touches.has('ArrowLeft') || touches.has('KeyQ')) cote -= 1;
  if (touches.has('ArrowRight') || touches.has('KeyD')) cote += 1;
  const courir = touches.has('ShiftLeft') || touches.has('ShiftRight');

  const bouge = avant !== 0 || cote !== 0;
  if (bouge) {
    const direction = Math.atan2(cote, avant) + angleCamera;
    const vitesse = (courir ? 11 : 5) * dt;
    heros.position.x += Math.sin(direction) * vitesse;
    heros.position.z += Math.cos(direction) * vitesse;
    const ecart = direction - heros.rotation.y;
    heros.rotation.y += Math.atan2(Math.sin(ecart), Math.cos(ecart)) * 0.18;
  }
  // Le heros epouse le relief.
  heros.position.y = hauteurTerrain(heros.position.x, heros.position.z);

  const cadence = bouge ? Math.sin(t * (courir ? 15 : 10)) : Math.sin(t * 1.4) * 0.12;
  heros.userData.jambes[0].rotation.x = cadence * 0.75;
  heros.userData.jambes[1].rotation.x = -cadence * 0.75;
  heros.userData.bras[0].rotation.x = -cadence * 0.65;
  heros.userData.bras[1].rotation.x = cadence * 0.65;

  // L'ombre suit le joueur : une petite boite d'ombre = des ombres nettes.
  soleil.target.position.copy(heros.position);
  soleil.position.copy(heros.position).addScaledVector(DIRECTION_SOLEIL, 90);

  positionCamera.set(
    heros.position.x - Math.sin(angleCamera) * distanceCamera,
    heros.position.y + hauteurCamera,
    heros.position.z - Math.cos(angleCamera) * distanceCamera
  );
  // La camera ne rentre pas dans le sol.
  const solSousCamera = hauteurTerrain(positionCamera.x, positionCamera.z) + 1.6;
  positionCamera.y = Math.max(positionCamera.y, solSousCamera);
  camera.position.lerp(positionCamera, 0.12);
  camera.lookAt(heros.position.x, heros.position.y + 1.5, heros.position.z);

  ciel.position.copy(camera.position);
  rendu.render(scene, camera);
}

document.getElementById('chargement').remove();
animer();

window.maquette = {
  scene, camera, heros, rendu,
  reglerCamera: (angle, distance, hauteur) => {
    angleCamera = angle;
    distanceCamera = distance;
    if (hauteur !== undefined) hauteurCamera = hauteur;
  },
  placerHeros: (x, z) => { heros.position.x = x; heros.position.z = z; },
  hauteurTerrain,
  centre: CENTRE,
};
